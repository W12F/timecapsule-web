<script>
window.__errs = window.__errs || [];
window.__showBootError = function () {
  try {
    var box = document.getElementById('boot-error');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'boot-error';
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;margin:0;padding:14px;background:rgba(255,255,255,.97);color:#a33;font:12px/1.6 monospace;z-index:99999;white-space:pre-wrap;border-top:1px solid #e8ddc8;';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = '启动出错（请截图给作者）：\n' + (window.__errs.join('\n') || '页面没有渲染出来');
  } catch (err) {}
};
window.addEventListener('error', function (e) {
  try {
    window.__errs.push((e.message || '') + ' @ ' + ((e.filename || '').split('/').pop()) + ':' + (e.lineno || 0));
    window.__showBootError();
  } catch (err) {}
});
window.addEventListener('unhandledrejection', function (e) {
  try {
    var r = e.reason;
    window.__errs.push('promise: ' + ((r && (r.message || r)) || ''));
    window.__showBootError();
  } catch (err) {}
});
setTimeout(function () {
  try {
    if (!document.querySelector('.screen') && !document.querySelector('.auth-card')) window.__showBootError();
  } catch (err) {}
}, 8000);
</script>

/* ==== styles\tokens.css ==== */
/* 时间胶囊 · 设计变量（暖纸） */
:root{
  --bg:#EFE9DC; --paper:#FBF7EE; --surface:#FFFDF7;
  --ink:#2A261F; --ink2:#5B544A; --muted:#8B8272;
  --line:rgba(42,38,31,.13); --line2:rgba(42,38,31,.07);
  --wax:#A3402F; --wax-soft:rgba(163,64,47,.09); --gold:#A98A55; --danger:#8C2F24;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
  --t-fast:150ms; --t-base:250ms; --t-seal:600ms; --t-open:800ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --radius-card:18px; --radius-btn:14px;
}

@media (prefers-reduced-motion: reduce){
  :root{ --t-fast:1ms; --t-base:1ms; --t-seal:1ms; --t-open:1ms; }
  *{ animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; }
}

/* ==== styles\base.css ==== */
/* 时间胶囊 · 基础样式与通用组件 */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:26px 0; min-height:100vh;
}
button{ font-family:inherit; }
[hidden]{ display:none !important; }

/* ---------- 手机外壳 ---------- */
.device{
  position:relative; width:410px; height:864px; flex:0 0 auto;
  border:10px solid #17181A; border-radius:56px; overflow:hidden;
  background:
    radial-gradient(120% 58% at 28% -2%, rgba(255,255,255,.55), transparent 56%),
    radial-gradient(110% 46% at 82% 102%, rgba(255,255,255,.32), transparent 58%),
    var(--paper);
  box-shadow:0 40px 80px -20px rgba(20,16,10,.45), 0 8px 24px rgba(20,16,10,.16);
}
.island{
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:112px; height:27px; border-radius:999px; background:#0B0C0D; z-index:60;
}
.status{
  position:absolute; top:0; left:0; right:0; height:46px; z-index:50;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 30px 7px; font-size:10.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.view{ position:absolute; inset:0; padding-top:46px; overflow:hidden; display:flex; flex-direction:column; }
.screen{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.scroll{ flex:1; overflow-y:auto; padding:6px 22px 30px; min-height:0; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }

/* ---------- 文字与通用块 ---------- */
.serif{ font-family:var(--serif); }
.num{ font-variant-numeric:tabular-nums; }
.k{ font-size:11px; color:var(--muted); letter-spacing:.08em; }
.meta{ font-size:12px; color:var(--muted); }
.muted{ color:var(--muted); }
.h1{ font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.35; margin:6px 0; letter-spacing:-.01em; }
.p{ font-size:15px; line-height:1.95; color:var(--ink2); margin:14px 0; white-space:pre-wrap; word-break:break-word; }
.sec{ display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 4px; }
.sec span{ font-size:11.5px; color:var(--muted); letter-spacing:.12em; }
.sec em{ font-style:normal; font-size:10.5px; color:var(--muted); opacity:.75; }
.center{ text-align:center; }

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid transparent; border-radius:var(--radius-btn);
  cursor:pointer; font-size:15px; font-weight:600; letter-spacing:.01em;
  height:52px; padding:0 18px; white-space:nowrap; transition:transform var(--t-fast) var(--ease), opacity var(--t-fast);
  -webkit-tap-highlight-color:transparent;
}
.btn:active{ transform:scale(.985); opacity:.92; }
.btn:disabled{ opacity:.38; cursor:not-allowed; transform:none; }
.btn-primary{ background:var(--ink); color:var(--paper); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink2); }
.btn-danger{ background:transparent; border-color:rgba(140,47,36,.4); color:var(--danger); }
.btn-block{ width:100%; }
.btn-sm{ height:42px; font-size:13px; border-radius:12px; }

/* ---------- 顶栏 ---------- */
.appbar{
  flex:0 0 auto; height:54px; display:grid; grid-template-columns:76px 1fr 76px;
  align-items:center; padding:0 12px; border-bottom:1px solid var(--line2);
}
.appbar .mid{ text-align:center; font-size:13px; font-weight:600; letter-spacing:.06em; }
.appbar button{
  border:0; background:none; font-size:13px; color:var(--muted);
  padding:10px 6px; cursor:pointer; text-align:left;
}
.appbar button.r{ text-align:right; color:var(--ink2); }
.appbar .placeholder{ display:block; }

/* ---------- 底部 Tab ---------- */
.tabbar{
  flex:0 0 auto; display:flex; padding:9px 0 14px; border-top:1px solid var(--line);
  background:rgba(251,247,238,.9); backdrop-filter:blur(8px);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
  border:0; background:none; font-size:10px; color:var(--muted); cursor:pointer;
  padding:4px 0; letter-spacing:.04em; transition:color var(--t-fast);
}
.tab.on{ color:var(--ink); }
.tab .ic{ width:24px; height:24px; display:grid; place-items:center; }
.tab .ic svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.55;
  stroke-linecap:round; stroke-linejoin:round; }
.tab.cta .ic{
  width:48px; height:48px; border-radius:50%; background:var(--ink); color:var(--paper);
  margin-top:-19px; box-shadow:0 10px 22px -8px rgba(0,0,0,.45);
}
.tab.cta .ic svg{ width:22px; height:22px; stroke-width:1.9; }

/* ---------- 底部动作条 ---------- */
.dock{
  flex:0 0 auto; padding:12px 22px 26px; border-top:1px solid var(--line2);
  background:rgba(251,247,238,.92); backdrop-filter:blur(8px);
  display:flex; gap:10px;
}
.dock .btn{ flex:1; }
.dock .btn-ghost:only-child{ flex:1; }
.dock .btn.aside{ flex:0 0 104px; }

/* ---------- 列表行 ---------- */
.item{
  display:flex; align-items:center; gap:13px; padding:15px 0;
  border-bottom:1px solid var(--line2); cursor:pointer; width:100%;
  background:none; border-left:0; border-right:0; border-top:0; text-align:left; font-family:inherit;
  color:inherit;
}
.item:hover .t{ color:var(--wax); }
.item .env{ width:22px; height:22px; color:var(--muted); flex:0 0 auto; }
.item .body{ flex:1; min-width:0; }
.item .t{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .m{ font-size:11.5px; color:var(--muted); margin-top:4px; }
.item .tag{
  font-size:10.5px; color:var(--muted); border:1px solid var(--line);
  border-radius:999px; padding:4px 9px; white-space:nowrap;
}
.item .tag.due{ color:var(--wax); border-color:rgba(163,64,47,.34); }
.item .tag.done{ opacity:.7; }

/* ---------- 空状态 ---------- */
.empty{ text-align:center; padding:46px 10px 20px; }
.empty .eico{ width:52px; height:52px; margin:0 auto 6px; color:var(--muted); opacity:.65; }
.empty .eico svg{ width:52px; height:52px; stroke:currentColor; fill:none; stroke-width:1.2; }
.empty .eh{ font-family:var(--serif); font-size:19px; font-weight:600; margin:14px 0 8px; }
.empty .ep{ font-size:13px; line-height:1.9; color:var(--muted); margin:0 0 22px; }

/* ---------- 弹层 ---------- */
.modal-layer{ position:absolute; inset:0; z-index:80; pointer-events:none; }
.modal-layer.open{ pointer-events:auto; }
.backdrop{
  position:absolute; inset:0; background:rgba(24,20,14,.34);
  animation:fadeIn var(--t-base) var(--ease);
}
@keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }
.dialog{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:calc(100% - 56px); max-width:334px; background:var(--surface);
  border:1px solid var(--line); border-radius:20px; padding:20px;
  animation:pop var(--t-base) var(--ease);
}
@keyframes pop{ from{ opacity:0; transform:translate(-50%,-48%) scale(.97) } to{ opacity:1; transform:translate(-50%,-50%) scale(1) } }
.dialog .dh{ font-size:16px; font-weight:600; }
.dialog .dx{ font-size:13px; line-height:1.75; color:var(--muted); margin:12px 0 20px; }
.dialog .dx b{ color:var(--ink); }
.dialog .dbtns{ display:flex; gap:9px; }
.dialog .dbtns .btn{ flex:1; height:46px; font-size:14px; border-radius:12px; }
.dialog .dbtns.stack{ flex-direction:column; }

.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--surface);
  border-radius:24px 24px 0 0; border-top:1px solid var(--line); padding:20px 22px 26px;
  animation:sheetUp var(--t-base) var(--ease);
}
@keyframes sheetUp{ from{ transform:translateY(24px); opacity:.4 } to{ transform:none; opacity:1 } }
.sheet .sh-title{ font-size:15px; font-weight:600; }
.sheet .sh-hint{ font-size:11.5px; color:var(--muted); margin-top:6px; }
.sheet .quick{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
.sheet .quick button{
  border:1px solid var(--line); background:var(--paper); color:var(--muted);
  border-radius:999px; padding:7px 13px; font-size:12px; cursor:pointer;
}
.sheet .quick button:hover{ color:var(--ink); border-color:var(--muted); }
.dt-row{ display:flex; gap:10px; margin:6px 0 18px; }
.dt-row label{ flex:1; display:block; }
.dt-row span{ display:block; font-size:10.5px; color:var(--muted); letter-spacing:.08em; margin-bottom:6px; }
.dt-row input{
  width:100%; height:46px; padding:0 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:14px;
  font-variant-numeric:tabular-nums;
}
.dt-row input:focus{ outline:2px solid rgba(42,38,31,.18); outline-offset:0; border-color:var(--muted); }
.sheet .sheet-btns{ display:flex; gap:10px; }
.sheet .sheet-btns .btn{ flex:1; height:48px; border-radius:13px; }

/* ---------- 轻提示 ---------- */
.toast{
  position:absolute; left:50%; bottom:172px; transform:translate(-50%,10px);
  max-width:calc(100% - 44px); padding:11px 18px; border-radius:999px;
  background:var(--ink); color:var(--paper); font-size:12.5px; line-height:1.5;
  opacity:0; pointer-events:none; transition:opacity var(--t-base) var(--ease), transform var(--t-base) var(--ease);
  z-index:90; text-align:center;
}
.toast.on{ opacity:1; transform:translate(-50%,0); }

/* ---------- 媒体九宫格 ---------- */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.cell{
  position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden;
  border:1px solid var(--line2); background:var(--surface); cursor:pointer; padding:0;
}
.cell img{ width:100%; height:100%; object-fit:cover; display:block; }
.cell .play{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.5); display:grid; place-items:center; backdrop-filter:blur(2px);
}
.cell .play svg{ width:14px; height:14px; fill:#fff; margin-left:2px; }
.cell .dur{
  position:absolute; right:7px; bottom:7px; font-size:9.5px; color:#fff;
  background:rgba(12,14,16,.6); padding:2px 6px; border-radius:6px;
  font-variant-numeric:tabular-nums;
}
.cell .del{
  position:absolute; right:5px; top:5px; width:24px; height:24px; border-radius:50%;
  border:0; background:rgba(12,14,16,.55); color:#fff; font-size:14px; line-height:1;
  display:grid; place-items:center; cursor:pointer;
}
.cell.add{
  border:1px dashed var(--line); background:transparent; display:grid; place-items:center;
  color:var(--muted); font-size:24px; font-weight:300;
}
.cell.add:hover{ border-color:var(--muted); color:var(--ink); }
.cell.loading{ display:grid; place-items:center; font-size:10.5px; color:var(--muted); text-align:center; padding:6px; }

/* ---------- 全屏媒体查看 ---------- */
.lightbox{
  position:absolute; inset:0; z-index:85; background:rgba(12,12,12,.94);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  animation:fadeIn var(--t-base) var(--ease);
}
.lightbox img, .lightbox video{ max-width:100%; max-height:78%; border-radius:10px; background:#000; }
.lightbox .lb-close{
  position:absolute; top:56px; right:22px; width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff;
  font-size:18px; cursor:pointer; display:grid; place-items:center;
}
.lightbox .lb-cap{ color:rgba(255,255,255,.6); font-size:11.5px; margin-top:14px; }

/* ---------- 启动失败 ---------- */
.boot-error{
  position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:var(--bg); padding:24px;
}
.boot-error-inner{ max-width:420px; }
.boot-error-title{ font-family:var(--serif); font-size:22px; font-weight:600; margin-bottom:14px; }
.boot-error p{ font-size:13.5px; line-height:1.8; color:var(--ink2); margin:0 0 10px; }
.boot-error pre{
  font-size:11px; color:var(--muted); background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:10px; overflow:auto; white-space:pre-wrap;
}

/* ---------- 补充 ---------- */
.item .env svg{
  width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round;
}
.cell.vid{ background:linear-gradient(160deg,#606468 0%,#3A3E43 55%,#24282D 100%); }
.dates{ font-size:11.5px; color:var(--muted); line-height:1.9; }
.hint{ font-size:11px; color:var(--muted); text-align:center; margin-top:10px; opacity:.85; }

/* ---------- 删除密码 ---------- */
.pin-row{ display:flex; justify-content:center; gap:9px; margin:4px 0 2px; }
.pin-row.two .pin-input{ font-size:22px; letter-spacing:.3em; }
.pin-input{
  width:100%; height:56px; border:1px solid var(--line); border-radius:14px;
  background:var(--paper); color:var(--ink); text-align:center;
  font-family:var(--sans); font-size:26px; letter-spacing:.45em;
  padding:0 0 0 .45em; font-variant-numeric:tabular-nums;
}
.pin-input::placeholder{ color:var(--muted); opacity:.45; letter-spacing:.2em; }
.pin-input:focus{ outline:none; border-color:var(--muted); }
.pin-error{ min-height:17px; text-align:center; font-size:11.5px; color:var(--danger); margin:8px 0 2px; }

/* ---------- 找回问题 ---------- */
.dialog{ max-height:calc(100% - 56px); overflow-y:auto; }
.rec-row{ margin:0 0 10px; }
.rec-label{ font-size:10.5px; color:var(--muted); letter-spacing:.06em; margin:6px 0 4px; }
.rec-q{ font-size:12.5px; color:var(--ink); line-height:1.5; margin:6px 0 6px; }
.rec-input{
  width:100%; height:44px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:13.5px;
  padding:0 12px;
}
.rec-input::placeholder{ color:var(--muted); opacity:.6; }
.rec-input:focus{ outline:none; border-color:var(--muted); }

/* ---------- 手机 / 移动端：去掉外壳，占满屏幕 ---------- */
@media (max-width: 560px) {
  body{ padding:0; align-items:stretch; background:var(--paper); }
  .device{
    width:100%; height:100vh; height:100dvh;
    border:0; border-radius:0; box-shadow:none;
  }
  .island{ display:none; }
  .status{ display:none; }
  .view{ padding-top:calc(10px + env(safe-area-inset-top, 0px)); }
  .tabbar{ padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
  .dock{ padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px)); }
  .scroll{ padding-left:18px; padding-right:18px; }
  .home-scroll{ padding-bottom:calc(150px + env(safe-area-inset-bottom, 0px)); }
  .toast{ bottom:calc(172px + env(safe-area-inset-bottom, 0px)); }
  .dialog{ width:calc(100% - 40px); }
  .lightbox .lb-close{ top:calc(56px + env(safe-area-inset-top, 0px)); }
}
/* ---------- iOS / WebKit 适配 ---------- */
@supports (-webkit-touch-callout: none) {
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  .scroll, .home-scroll{ -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  input, textarea, select{ font-size:16px; }          /* 防止聚焦自动放大 */
  input[type="date"], input[type="time"]{ min-height:36px; }
  .tabbar{ padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px)) !important; }
  .dock{ padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)) !important; }
  .home-scroll{ padding-bottom:calc(140px + env(safe-area-inset-bottom, 0px)) !important; }
  .toast{ bottom:calc(158px + env(safe-area-inset-bottom, 0px)) !important; }
}

<script>
(function(){
'use strict';

/* ==================== src\time.js ==================== */
/* 时间工具：格式化、倒计时、到期判断 */
const DAY = 24 * 60 * 60 * 1000;
const MINUTE = 60 * 1000;

function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

function fmtHMS(d) {
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

function fmtHM(d) {
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

function fmtDateCN(d) {
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()];
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function fmtTime(ts) {
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtDateTime(ts) {
  return fmtDate(ts) + ' ' + fmtTime(ts);
}

function fmtMonthCN(ts) {
  const d = new Date(ts);
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
}

function fmtDuration(seconds) {
  if (!seconds || !isFinite(seconds)) return '';
  const s = Math.max(0, Math.round(seconds));
  const m = Math.floor(s / 60);
  const rest = s % 60;
  return pad2(m) + ':' + pad2(rest);
}

function remainParts(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(total / 86400);
  const hours = Math.floor((total % 86400) / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;
  return { days, hours, minutes, seconds, total };
}

/** 列表用的倒计时文本：「41 天」「06:12:33」「已到期」 */
function countdownText(ms) {
  if (ms <= 0) return '已到期';
  const p = remainParts(ms);
  if (p.days > 0) return p.days + ' 天';
  return pad2(p.hours) + ':' + pad2(p.minutes) + ':' + pad2(p.seconds);
}

/** 大号倒计时文本：「41 天 06:12:33」 */
function countdownLong(ms) {
  if (ms <= 0) return '已到期';
  const p = remainParts(ms);
  if (p.days > 0) {
    return p.days + ' 天 ' + pad2(p.hours) + ':' + pad2(p.minutes) + ':' + pad2(p.seconds);
  }
  return pad2(p.hours) + ':' + pad2(p.minutes) + ':' + pad2(p.seconds);
}

function remainDays(ms) {
  return Math.max(0, Math.ceil(ms / DAY));
}

function isDue(cap, now) {
  return cap && cap.status === 'sealed' && cap.unlockAt <= (now || Date.now());
}

/** 快捷时间选项 */
function quickUnlockOptions(now) {
  const base = now || Date.now();
  return [
    { label: '1 小时后', ts: base + 60 * MINUTE },
    { label: '明天此刻', ts: base + DAY },
    { label: '1 个月后', ts: addMonths(base, 1) },
    { label: '1 年后', ts: addMonths(base, 12) }
  ];
}

function addMonths(ts, months) {
  const d = new Date(ts);
  const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  if (d.getDate() < day) d.setDate(0); // 处理 31 号等溢出
  return d.getTime();
}

/** 判断某个时间戳是否允许作为开启时间（至少 1 分钟后） */
function isAllowedUnlock(ts, now) {
  return isFinite(ts) && ts >= (now || Date.now()) + MINUTE - 1000;
}

function startOfToday(now) {
  const d = new Date(now || Date.now());
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function svg(name) {

/**
 * h('div', {class:'x', text:'hi', onclick:fn}, child, ...)
 */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const val = attrs[key];
      if (val === null || val === undefined || val === false) continue;
      if (key === 'class') el.className = val;
      else if (key === 'text') el.textContent = val;
      else if (key === 'html') el.innerHTML = val;
      else if (key === 'dataset') Object.assign(el.dataset, val);
      else if (key.indexOf('on') === 0 && typeof val === 'function') el.addEventListener(key.slice(2).toLowerCase(), val);
      else if (val === true) el.setAttribute(key, '');
      else el.setAttribute(key, String(val));
    }
  }
  appendAll(el, Array.prototype.slice.call(arguments, 2));
  return el;
}

function appendAll(el, kids) {
  for (const kid of kids) {
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) { appendAll(el, kid); continue; }
    if (kid instanceof Node) el.appendChild(kid);
    else el.appendChild(document.createTextNode(String(kid)));
  }
}

function iconEl(name, cls) {
  const span = document.createElement('span');
  span.className = cls || 'ic';
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = svg(name);
  return span;
}

/* 本机存储：IndexedDB。三张表：capsules / blobs / posters */
const DB_NAME = 'timecapsule';
const DB_VERSION = 1;

let db = null;

function openDb() {
  return new Promise((resolve, reject) => {
    let req;
    try {
      req = indexedDB.open(DB_NAME, DB_VERSION);
    } catch (err) {
      reject(err);
      return;
    }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('capsules')) d.createObjectStore('capsules', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('posters')) d.createObjectStore('posters', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    req.onblocked = () => reject(new Error('IndexedDB 被其它标签页占用，请关掉其它时间胶囊窗口'));
  });
}

function isAvailable() {
  try {
    return typeof indexedDB !== 'undefined' && indexedDB !== null;
  } catch (err) {
    return false;
  }
}

async function init() {
  db = await openDb();
  // 申请持久存储，但不阻塞启动：部分浏览器（尤其无头模式）会一直不返回
  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist().catch(() => {}); } catch (err) { /* 忽略 */ }
  }
}

function txStore(name, mode) {
  return db.transaction(name, mode || 'readonly').objectStore(name);
}

function wrap(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function listCapsules() {
  const all = await wrap(txStore('capsules').getAll());
  return all || [];
}

async function getCapsule(id) {
  return wrap(txStore('capsules').get(id));
}

async function saveCapsule(cap) {
  await wrap(txStore('capsules', 'readwrite').put(cap));
  return cap;
}

async function saveBlob(rec) {
  return wrap(txStore('blobs', 'readwrite').put(rec));
}

async function getBlob(id) {
  const rec = await wrap(txStore('blobs').get(id));
  return rec ? rec.blob : null;
}

async function savePoster(rec) {
  return wrap(txStore('posters', 'readwrite').put(rec));
}

async function getPoster(id) {
  const rec = await wrap(txStore('posters').get(id));
  return rec ? rec.blob : null;
}

async function deleteMedia(id) {
  const tx = db.transaction(['blobs', 'posters'], 'readwrite');
  const done = new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  tx.objectStore('blobs').delete(id);
  tx.objectStore('posters').delete(id);
  await done;
}

async function deleteCapsule(id) {  const cap = await getCapsule(id);
  const tx = db.transaction(['capsules', 'blobs', 'posters'], 'readwrite');
  const done = new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('删除失败'));
  });
  tx.objectStore('capsules').delete(id);
  if (cap && Array.isArray(cap.media)) {
    for (const m of cap.media) {
      tx.objectStore('blobs').delete(m.id);
      tx.objectStore('posters').delete(m.id);
    }
  }
  await done;
}

async function estimate() {
  if (!navigator.storage || !navigator.storage.estimate) return null;
  try { return await navigator.storage.estimate(); } catch (err) { return null; }
}

const store = { isAvailable: isAvailable, init: init, listCapsules: listCapsules, getCapsule: getCapsule, saveCapsule: saveCapsule, saveBlob: saveBlob, getBlob: getBlob, savePoster: savePoster, getPoster: getPoster, deleteMedia: deleteMedia, deleteCapsule: deleteCapsule, estimate: estimate };

const LIMITS = {
  MAX_MEDIA: 9,
  MAX_IMAGE: 10 * 1024 * 1024,
  MAX_VIDEO: 200 * 1024 * 1024,
  MAX_VIDEOS: 3
};

const IMAGE_RE = /^image\//;
const VIDEO_RE = /^video\//;

function fileKind(file) {
  const type = file.type || '';
  if (VIDEO_RE.test(type)) return 'video';
  if (IMAGE_RE.test(type)) return 'image';
  const name = (file.name || '').toLowerCase();
  if (/\.(mp4|webm|mov|m4v|ogv)$/.test(name)) return 'video';
  if (/\.(jpg|jpeg|png|webp|gif|avif|heic)$/.test(name)) return 'image';
  return null;
}

/** 打开系统选文件框，返回 File[] */
function pickFiles() {
  // Android App：原生桥接；优先文件流，失败再用 base64 兜底
  if (window.AndroidPicker && typeof window.AndroidPicker.pickMedia === 'function') {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (files) => {
        if (settled) return;
        settled = true;
        window.__nativePicked = null;
        resolve(files || []);
      };

      const b64ToBlob = (b64, type) => {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: type || 'application/octet-stream' });
      };

      const loadOne = (it) => {
        const toFile = (blob) => new File([blob], it.name || 'media', { type: it.type || blob.type || 'application/octet-stream' });
        return fetch(it.url)
          .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
          .catch(() => {
            if (window.AndroidPicker && window.AndroidPicker.readBase64 && it.token) {
              const b64 = window.AndroidPicker.readBase64(it.token);
              if (b64) return b64ToBlob(b64, it.type);
            }
            throw new Error('read-failed');
          })
          .then(toFile);
      };

      window.__nativePicked = function (items) {
        if (settled) return;
        const list = Array.isArray(items) ? items : [];
        if (!list.length) { finish([]); return; }
        Promise.all(list.map((it) => loadOne(it).catch(() => null)))
          .then((files) => {
            const ok = files.filter(Boolean);
            if (!ok.length && list.length) {
              try { toast('读取所选文件失败，请重试或换一张图片'); } catch (e) { /* ignore */ }
            }
            finish(ok);
          });
      };

      try {
        window.AndroidPicker.pickMedia();
      } catch (err) {
        finish([]);
        return;
      }
      setTimeout(function () { if (!settled) finish([]); }, 10 * 60 * 1000);
    });
  }

  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,video/*';
    input.multiple = true;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    input.style.top = '0';
    document.body.appendChild(input);
    let settled = false;
    const finish = (files) => {
      if (settled) return;
      settled = true;
      input.remove();
      resolve(files);
    };
    input.addEventListener('change', () => finish(Array.from(input.files || [])));
    input.addEventListener('cancel', () => finish([]));
    input.click();
  });
}

/** 截取视频首帧 + 读取时长；失败返回 {poster:null, duration} */
function makePoster(file) {
  return new Promise((resolve) => {
    let url = null;
    let video = null;
    let settled = false;
    const finish = (poster, duration) => {
      if (settled) return;
      settled = true;
      if (url) URL.revokeObjectURL(url);
      if (video) {
        video.removeAttribute('src');
        try { video.load(); } catch (err) { /* ignore */ }
      }
      resolve({ poster: poster || null, duration: (typeof duration === 'number' && isFinite(duration)) ? duration : null });
    };

    try {
      url = URL.createObjectURL(file);
      video = document.createElement('video');
      video.preload = 'auto';
      video.muted = true;
      video.playsInline = true;
      video.crossOrigin = 'anonymous';
    } catch (err) {
      finish(null, null);
      return;
    }

    const timer = setTimeout(() => finish(null, video.duration), 9000);

    video.addEventListener('loadedmetadata', () => {
      const d = isFinite(video.duration) ? video.duration : 0;
      const target = d > 0 ? Math.min(0.3, d / 2) : 0;
      try { video.currentTime = target; } catch (err) { finish(null, d); }
    });

    video.addEventListener('seeked', () => {
      clearTimeout(timer);
      try {
        const w = video.videoWidth || 0;
        const h = video.videoHeight || 0;
        if (!w || !h) { finish(null, video.duration); return; }
        const scale = Math.min(1, 480 / Math.max(w, h));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(w * scale));
        canvas.height = Math.max(1, Math.round(h * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => finish(blob, video.duration), 'image/jpeg', 0.72);
      } catch (err) {
        finish(null, video.duration);
      }
    });

    video.addEventListener('error', () => { clearTimeout(timer); finish(null, null); });

    // 先设 src 再等 metadata；某些浏览器要求显式 load
    video.src = url;
    try { video.load(); } catch (err) { /* ignore */ }
  });
}

/* ---------------- objectURL 缓存 ---------------- */
const urlCache = new Map();

function urlFor(key, blob) {
  if (!blob) return null;
  if (urlCache.has(key)) return urlCache.get(key);
  const u = URL.createObjectURL(blob);
  urlCache.set(key, u);
  return u;
}

function releaseAll() {
  urlCache.forEach((u) => URL.revokeObjectURL(u));
  urlCache.clear();
}

function release(key) {
  if (!urlCache.has(key)) return;
  URL.revokeObjectURL(urlCache.get(key));
  urlCache.delete(key);
}

        img.src = urlFor(key, blob);
        cell.prepend(img);
      } catch (err) { /* 缩略图失败就留空白格 */ }
    })();
  }
  return grid;
}

async function openViewer(m) {
  try {
    const blob = await store.getBlob(m.id);
    if (!blob) { toast('附件读取失败'); return; }
    const key = 'lb_' + m.id;
    const src = urlFor(key, blob);
    const close = () => { release(key); closeLayer(); };

    let node;
    if (m.kind === 'video') {
      node = h('video', { src: src, controls: true, playsinline: true });
    } else {
      node = h('img', { src: src, alt: '' });
    }

    const capText = m.kind === 'video'
      ? (m.name || '视频') + ' · ' + (fmtDuration(m.duration) || '')
      : (m.name || '图片');

    const box = h('div', { class: 'lightbox' },
      h('button', { class: 'lb-close', html: '×', onclick: close, 'aria-label': '关闭' }),
      node,
      h('div', { class: 'lb-cap', text: capText })
    );
    openLayer(box, { onBackdrop: close });
  } catch (err) {
    toast('附件打开失败');
  }
}

/* 删除密码：4 位数字，本机保存（哈希后），防止手滑删掉胶囊 */


const KEY = 'tc_delete_pin_v1';

async function hashText(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (err) {
    return 'plain:' + text;
  }
}

function hasPin() {
  try { return !!localStorage.getItem(KEY); } catch (err) { return false; }
}

async function savePin(pin) {
  localStorage.setItem(KEY, await hashText(pin));
}

async function verifyPin(pin) {
  const rec = localStorage.getItem(KEY);
  if (!rec) return true;
  return rec === await hashText(pin);
}

function digitInput(placeholder, cls) {
  const input = h('input', {
    class: 'pin-input' + (cls ? ' ' + cls : ''),
    type: 'password',
    inputmode: 'numeric',
    maxlength: '4',
    autocomplete: 'off',
    placeholder: placeholder || '••••'
  });
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
  });
  return input;
}

/* 第一次删除时：设置一个 4 位删除密码 */
function requestNewPin(opt) {
  return new Promise((resolve) => {
    const a = digitInput('••••');
    const b = digitInput('再输一次');
    const err = h('div', { class: 'pin-error', text: '' });

    const ok = h('button', {
      class: 'btn btn-primary',
      onclick: async () => {
        if (!/^\d{4}$/.test(a.value)) { err.textContent = '请输入 4 位数字'; a.focus(); return; }
        if (a.value !== b.value) { err.textContent = '两次输入不一致'; b.value = ''; b.focus(); return; }
        await savePin(a.value);
        closeLayer();
        resolve(true);
      }
    }, opt.okText || '保存密码并删除');

    const cancel = h('button', {
      class: 'btn btn-ghost',
      onclick: () => { closeLayer(); resolve(false); }
    }, '取消');

    const dlg = h('div', { class: 'dialog' },
      h('div', { class: 'dh', text: opt.title || '设置删除密码' }),
      h('div', { class: 'dx', html: opt.message || '' }),
      h('div', { class: 'pin-row two' }, a, b),
      err,
      h('div', { class: 'dbtns' }, cancel, ok)
    );
    openLayer(dlg, { onBackdrop: () => { closeLayer(); resolve(false); } });
    setTimeout(() => { try { a.focus(); } catch (e) { /* ignore */ } }, 60);
  });
}

/* 已有密码时：输入 4 位密码确认删除 */
function requestPin(opt) {
  return new Promise((resolve) => {
    const input = digitInput('••••');
    const err = h('div', { class: 'pin-error', text: '' });

    async function submit() {
      if (!/^\d{4}$/.test(input.value)) { err.textContent = '请输入 4 位数字'; return; }
      const okPin = await verifyPin(input.value);
      if (!okPin) {
        err.textContent = '密码不对，再试一次';
        input.value = '';
        try { input.focus(); } catch (e) { /* ignore */ }
        return;
      }
      closeLayer();
      resolve(true);
    }

    const ok = h('button', {
      class: 'btn ' + (opt.danger ? 'btn-danger' : 'btn-primary'),
      onclick: submit
    }, opt.okText || '确定');

    const cancel = h('button', {
      class: 'btn btn-ghost',
      onclick: () => { closeLayer(); resolve(false); }
    }, '取消');

    const dlg = h('div', { class: 'dialog' },
      h('div', { class: 'dh', text: opt.title || '输入删除密码' }),
      h('div', { class: 'dx', html: opt.message || '' }),
      h('div', { class: 'pin-row' }, input),
      err,
      h('div', { class: 'dbtns' }, cancel, ok)
    );

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });

    openLayer(dlg, { onBackdrop: () => { closeLayer(); resolve(false); } });
    setTimeout(() => { try { input.focus(); } catch (e) { /* ignore */ } }, 60);
  });
}

/* ---------------- 找回问题（忘记密码用） ---------------- */
const RKEY = 'tc_recovery_v1';

function normAnswer(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, '');
}

function hasRecovery() {
  try {
    const raw = localStorage.getItem(RKEY);
    if (!raw) return false;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) && arr.length === 3 && arr.every((x) => x && x.q && x.h);
  } catch (err) {
    return false;
  }
}

function getRecoveryQuestions() {
  try {
    const arr = JSON.parse(localStorage.getItem(RKEY) || '[]');
    if (!Array.isArray(arr)) return [];
    return arr.map((x) => (x && x.q) ? x.q : '');
  } catch (err) {
    return [];
  }
}

async function saveRecovery(items) {
  const arr = [];
  for (const it of items) {
    arr.push({ q: String(it.q || '').trim(), h: await hashText(normAnswer(it.a)) });
  }
  localStorage.setItem(RKEY, JSON.stringify(arr));
}

async function verifyRecovery(answers) {
  let arr;
  try { arr = JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (err) { return false; }
  if (!Array.isArray(arr) || arr.length !== 3) return false;
  for (let i = 0; i < 3; i++) {
    const h = await hashText(normAnswer(answers[i]));
    if (h !== arr[i].h) return false;
  }
  return true;
}

/* 设置 3 个找回问题（问题和答案都由自己填） */
function requestRecoverySetup(opt) {
  return new Promise((resolve) => {
    const rows = [];
    for (let i = 0; i < 3; i++) {
      const q = h('input', {
        class: 'rec-input', type: 'text', maxlength: '40',
        placeholder: '例如：我第一只宠物叫什么'
      });
      const a = h('input', {
        class: 'rec-input', type: 'text', maxlength: '60',
        placeholder: '答案（只存哈希，本机可见）'
      });
      rows.push({ q: q, a: a });
    }

    const err = h('div', { class: 'pin-error', text: '' });

    function validate() {
      for (const r of rows) {
        if (!r.q.value.trim() || !r.a.value.trim()) return false;
      }
      return true;
    }

    const ok = h('button', {
      class: 'btn btn-primary',
      onclick: async () => {
        if (!validate()) { err.textContent = '3 个问题和答案都要填'; return; }
        await saveRecovery(rows.map((r) => ({ q: r.q.value, a: r.a.value })));
        closeLayer();
        resolve(true);
      }
    }, opt.okText || '保存');

    const cancel = h('button', {
      class: 'btn btn-ghost',
      onclick: () => { closeLayer(); resolve(false); }
    }, opt.cancelText || '稍后设置');

    const body = h('div', null,
      rows.map((r, i) => h('div', { class: 'rec-row' },
        h('div', { class: 'rec-label', text: '问题 ' + (i + 1) }),
        r.q,
        h('div', { class: 'rec-label', text: '答案' }),
        r.a
      ))
    );

    const dlg = h('div', { class: 'dialog' },
      h('div', { class: 'dh', text: opt.title || '设置 3 个找回问题' }),
      h('div', { class: 'dx', html: opt.message || '忘记密码时，答对这 3 个问题就能重设密码。<br>问题和答案都由你自己定。' }),
      body,
      err,
      h('div', { class: 'dbtns' }, cancel, ok)
    );
    openLayer(dlg, { onBackdrop: () => { closeLayer(); resolve(false); } });
  });
}

/* 忘记密码：回答 3 个问题 */
function requestRecovery() {
  const questions = getRecoveryQuestions();
  return new Promise((resolve) => {
    const answers = questions.map((_, i) => h('input', {
      class: 'rec-input', type: 'text', maxlength: '60',
      placeholder: '第 ' + (i + 1) + ' 题的答案'
    }));
    const err = h('div', { class: 'pin-error', text: '' });

    const ok = h('button', {
      class: 'btn btn-primary',
      onclick: async () => {
        if (answers.some((a) => !a.value.trim())) { err.textContent = '3 个答案都要填'; return; }
        const pass = await verifyRecovery(answers.map((a) => a.value));
        if (!pass) {
          err.textContent = '答案不对，再试一次';
          answers.forEach((a) => { a.value = ''; });
          try { answers[0].focus(); } catch (e) { /* ignore */ }
          return;
        }
        closeLayer();
        resolve(true);
      }
    }, '回答问题');

    const cancel = h('button', {
      class: 'btn btn-ghost',
      onclick: () => { closeLayer(); resolve(false); }
    }, '取消');

    const body = h('div', null,
      questions.map((q, i) => h('div', { class: 'rec-row' },
        h('div', { class: 'rec-q', text: (i + 1) + '. ' + q }),
        answers[i]
      ))
    );

    const dlg = h('div', { class: 'dialog' },
      h('div', { class: 'dh', text: '找回删除密码' }),
      h('div', { class: 'dx', html: '答对 3 个问题后，可以设置新的 4 位删除密码。' }),
      body,
      err,
      h('div', { class: 'dbtns' }, cancel, ok)
    );
    openLayer(dlg, { onBackdrop: () => { closeLayer(); resolve(false); } });
    setTimeout(() => { try { answers[0].focus(); } catch (e) { /* ignore */ } }, 60);
  });
}

/* 天气系统：地址 + 温度 + 卡通表情特效（热出汗 / 冷流鼻涕 / 雨伞 / 雪） */


const PLACE_KEY = 'tc_weather_place_v1';
const CACHE_KEY = 'tc_weather_cache_v1';
const CACHE_MS = 30 * 60 * 1000;

const weatherState = {
  ok: false,
  place: null,      // { name }
  temp: null,
  code: null,
  text: '',
  fx: { rain: false, snow: false, hot: false, cold: false },
  updatedAt: 0,
  loading: false
};

/* WWO 天气码 → 中文 */
const WWO = {
  113: '晴', 116: '多云', 119: '阴', 122: '阴', 143: '薄雾', 149: '霾',
  176: '局部有雨', 179: '局部有雪', 182: '雨夹雪', 185: '冻毛毛雨',
  200: '雷暴', 227: '吹雪', 230: '暴风雪', 248: '雾', 260: '冻雾',
  263: '小毛毛雨', 266: '毛毛雨', 281: '冻毛毛雨', 284: '强冻毛毛雨',
  293: '小雨', 296: '小雨', 299: '中雨', 302: '中雨', 305: '大雨', 308: '大雨',
  311: '冻雨', 314: '冻雨', 317: '雨夹雪', 320: '雨夹雪',
  323: '小雪', 326: '小雪', 329: '中雪', 332: '中雪', 335: '大雪', 338: '大雪',
  350: '冰粒', 353: '小阵雨', 356: '阵雨', 359: '暴雨',
  362: '雨夹雪', 365: '雨夹雪', 368: '小阵雪', 371: '阵雪',
  374: '冰粒', 377: '冰粒', 386: '雷阵雨', 389: '强雷阵雨',
  392: '雷阵雪', 395: '强雷阵雪'
};
const RAIN_CODES = [176, 182, 185, 200, 263, 266, 281, 284, 293, 296, 299, 302, 305, 308, 311, 314, 317, 320, 353, 356, 359, 362, 365, 386, 389];
const SNOW_CODES = [179, 227, 230, 323, 326, 329, 332, 335, 338, 368, 371, 392, 395];

function readJSON(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (err) { return null; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) { /* ignore */ }
}

async function getJSON(url, ms) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms || 9000) : null;
  try {
    const res = await fetch(url, ctrl ? { signal: ctrl.signal } : undefined);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

/** 查一个城市的天气（query 为空 = 按本机 IP 自动定位） */
async function fetchWttr(query) {
  const q = String(query || '').trim();
  const url = 'https://wttr.in/' + encodeURIComponent(q) + '?format=j1&lang=zh';
  const j = await getJSON(url, 10000);
  const cur = j && j.current_condition && j.current_condition[0];
  const area = j && j.nearest_area && j.nearest_area[0];
  if (!cur) throw new Error('没有天气数据');
  const code = Number(cur.weatherCode);
  const temp = Number(cur.temp_C);
  let areaName = '';
  try { areaName = area.areaName[0].value; } catch (err) { areaName = q; }
  return { areaName: areaName, temp: temp, code: code };
}

function weatherGetPlace() {
  return readJSON(PLACE_KEY);
}

/** 自动定位：先用 IP 查城市（更准），失败再用 wttr 的定位 */
async function weatherDetectPlace() {
  const saved = weatherGetPlace();
  if (saved && saved.name) return saved;
  try {
    const ip = await getJSON('https://ipwho.is/', 6000);
    if (ip && ip.success !== false && (ip.city || ip.region)) {
      const place = { name: ip.city || ip.region };
      writeJSON(PLACE_KEY, place);
      return place;
    }
  } catch (err) { /* 换 wttr 定位 */ }
  try {
    const r = await fetchWttr('');
    const place = { name: r.areaName || '我的位置' };
    writeJSON(PLACE_KEY, place);
    return place;
  } catch (err) {
    return null;
  }
}

function weatherApply(place, info) {
  const temp = info && typeof info.temp === 'number' ? info.temp : null;
  const code = info && typeof info.code === 'number' ? info.code : null;
  const text = WWO[code] || info.text || '';
  const fx = {
    rain: RAIN_CODES.indexOf(code) >= 0,
    snow: SNOW_CODES.indexOf(code) >= 0,
    hot: temp !== null && temp >= 27,
    cold: temp !== null && temp <= 10
  };
  weatherState.ok = temp !== null && !isNaN(temp);
  weatherState.place = place || weatherState.place;
  weatherState.temp = temp;
  weatherState.code = code;
  weatherState.text = text;
  weatherState.fx = fx;
  weatherState.updatedAt = Date.now();
  writeJSON(CACHE_KEY, {
    place: weatherState.place,
    temp: temp,
    code: code,
    updatedAt: weatherState.updatedAt
  });
  return weatherState;
}

function weatherFromCache() {
  const c = readJSON(CACHE_KEY);
  if (!c || !c.updatedAt) return false;
  if (Date.now() - c.updatedAt > CACHE_MS) return false;
  if (!c.place || typeof c.temp !== 'number') return false;
  weatherApply(c.place, c);
  weatherState.loading = false;
  return true;
}

async function weatherRefresh(force) {
  weatherState.loading = true;
  if (!force && weatherGetPlace() && weatherFromCache()) return weatherState;
  const place = await weatherDetectPlace();
  if (!place) {
    weatherState.ok = false;
    weatherState.loading = false;
    return weatherState;
  }
  try {
    const info = await fetchWttr(place.name);
    if (info.areaName && place.auto) place.name = info.areaName;
    weatherApply(place, info);
  } catch (err) {
    weatherState.loading = false;
  }
  weatherState.loading = false;
  return weatherState;
}

async function weatherSetPlaceByQuery(name) {
  const q = String(name || '').trim();
  if (!q) return { ok: false, error: '先输入城市名' };
  try {
    const info = await fetchWttr(q);
    const place = { name: q, area: info.areaName };
    writeJSON(PLACE_KEY, place);
    weatherApply(place, info);
    return { ok: true, place: place };
  } catch (err) {
    return { ok: false, error: '没找到这个城市（可以试试「苏州」「上海」「Tokyo」）' };
  }
}

/* 2 月 9 日的一句话彩蛋 */
function nineFebruary(date) {
  const d = date || currentNow();
  return (d.getMonth() + 1) === 2 && d.getDate() === 9;
}

/* 作者生日彩蛋：11 月 12 日 */
function authorBirthday(date) {
  const d = date || currentNow();
  return (d.getMonth() + 1) === 11 && d.getDate() === 12;

/* ---------------- 当前日期（支持 ?devdate=MM-DD&devtime=HH:MM 预览彩蛋） ---------------- */
function currentNow() {
  const params = new URLSearchParams(location.search);
  const q = params.get('devdate');
  let t = new Date();
  if (q && /^\d{2}-\d{2}$/.test(q)) {
    const parts = q.split('-');
    const m = Number(parts[0]);
    const d = Number(parts[1]);
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      t.setMonth(m - 1, d);
    }
  }
  const tq = params.get('devtime');
  if (tq && /^\d{1,2}:\d{2}$/.test(tq)) {
    const tp = tq.split(':');
    const h = Number(tp[0]);
    const mi = Number(tp[1]);
    if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) {
      t.setHours(h, mi, 0, 0);
    }
  }
  return t;
}

/* ---------------- 生日存储 ---------------- */
function getBirthday() {
  try {
    const raw = localStorage.getItem(BDAY_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o && o.m >= 1 && o.m <= 12 && o.d >= 1 && o.d <= 31) return o;
    return null;
  } catch (err) { return null; }
}

function setBirthday(m, d) {

function clearBirthday() {

  '2030-02-03', '2031-01-23', '2032-02-11', '2033-01-31', '2034-02-19', '2035-02-08'];
const MID = ['2024-09-17', '2025-10-06', '2026-09-25', '2027-09-15', '2028-10-03', '2029-09-22',
  '2030-09-12', '2031-10-01', '2032-09-19', '2033-09-08', '2034-09-27', '2035-09-16'];

function parseDate(str) {
  const p = str.split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function offsetDay(now, list, offset) {
  for (const s of list) {
    const t = parseDate(s);
    t.setDate(t.getDate() + offset);
    if (sameDay(now, t)) return true;
  }
  return false;
}

/** 返回今天的节日（生日优先），没有则 null */
function todayFestival(now) {
  const d = now || currentNow();
  const m = d.getMonth() + 1;
  const day = d.getDate();

  const bday = getBirthday();
  if (bday && bday.m === m && bday.d === day) {
    return {
      id: 'birthday', kind: 'birthday', greeting: '生日快乐',
      sub: '今天是你的生日，许个愿吧', avatar: 'birthday'
    };
  }

  if (offsetDay(d, CNY, -1)) return { id: 'chuxi', kind: 'festival', greeting: '除夕快乐', sub: '把这一年的心事收进胶囊里', avatar: 'spring' };
  if (offsetDay(d, CNY, 0)) return { id: 'cny', kind: 'festival', greeting: '新春快乐', sub: '新的一岁，新的信', avatar: 'spring' };
  if (offsetDay(d, CNY, 14)) return { id: 'lantern', kind: 'festival', greeting: '元宵节快乐', sub: '圆月之下，写点什么吧', avatar: 'spring' };
  if (offsetDay(d, MID, 0)) return { id: 'midautumn', kind: 'festival', greeting: '中秋快乐', sub: '月圆的时候，最容易想起未来', avatar: 'moon' };

  for (const f of SOLAR) {
    if (f.m === m && f.d === day) {
      return { id: f.id, kind: 'festival', greeting: f.greeting, sub: f.sub, avatar: f.avatar };
    }
  }
  return null;
}

/* ---------------- 我的页：生日设置 ---------------- */
function daysInMonth(m) {
  const d = new Date(2024, m, 0).getDate();
  return d;
}

function selectEl(options, value) {
  const sel = h('select', { class: 'sel' });
  for (const o of options) {
    const opt = h('option', { value: String(o.v) }, o.t);
    if (String(o.v) === String(value)) opt.selected = true;
    sel.append(opt);
  }
  return sel;
}

function openBirthdayPicker(onDone) {
  const cur = getBirthday();
  const now = currentNow();
  const monthSel = selectEl(Array.from({ length: 12 }, (_, i) => ({ v: i + 1, t: (i + 1) + ' 月' })), cur ? cur.m : now.getMonth() + 1);
  const daySel = selectEl(Array.from({ length: 31 }, (_, i) => ({ v: i + 1, t: (i + 1) + ' 日' })), cur ? cur.d : now.getDate());

  function syncDays() {
    const max = daysInMonth(Number(monthSel.value));
    const keep = Math.min(Number(daySel.value) || 1, max);
    daySel.textContent = '';
    for (let i = 1; i <= max; i++) daySel.append(h('option', { value: String(i) }, i + ' 日'));
    daySel.value = String(keep);
  }
  monthSel.addEventListener('change', syncDays);
  syncDays();

  const err = h('div', { class: 'pin-error', text: '' });
  const btns = h('div', { class: 'dbtns' });

  if (cur) {
    btns.append(h('button', {

/* ==================== src\auth.js ==================== */
/* 本机账号：注册 / 登录 / 编号 / 会话 */


const USERS_KEY = 'tc_users_v1';
const SESSION_KEY = 'tc_session_v1';

function listUsers() {
  try {
    const raw = localStorage.getItem(USERS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (err) {
    return [];
  }
}

function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

function userCount() {
  return listUsers().length;
}

/** 编号：前 2 位（超过 99 自动变 3 位…）按注册顺序，后面 4 位随机，初始 6 位 */
function makeId(users) {
  const seq = users.length + 1;
  const prefix = String(seq).padStart(2, '0');
  let id = '';
  do {
    id = prefix + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  } while (users.some((u) => u.id === id));
  return { id: id, seq: seq };
}

function getSessionUser() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.id) return null;
    return listUsers().find((u) => u.id === s.id) || null;
  } catch (err) {
    return null;
  }
}

function setSession(user) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id }));
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
}

async function register(nick, pass, pass2) {
  const name = String(nick || '').trim();
  const pwd = String(pass || '');
  if (name.length < 2) return { ok: false, error: '昵称至少 2 个字' };
  if (name.length > 12) return { ok: false, error: '昵称最多 12 个字' };
  if (pwd.length < 4) return { ok: false, error: '密码至少 4 位' };
  if (pwd !== String(pass2 || '')) return { ok: false, error: '两次密码不一致' };

  const users = listUsers();
  if (users.some((u) => u.nick === name)) return { ok: false, error: '这个昵称已经有人用了' };

  const gen = makeId(users);
  const user = {
    id: gen.id,
    seq: gen.seq,
    nick: name,
    pass: await hashText(pwd),
    createdAt: Date.now()
  };
  users.push(user);
  saveUsers(users);
  setSession(user);
  return { ok: true, user: user };
}

async function login(account, pass) {
  const key = String(account || '').trim();
  const pwd = String(pass || '');
  if (!key) return { ok: false, error: '请输入编号或昵称' };
  if (!pwd) return { ok: false, error: '请输入密码' };
  const users = listUsers();
  const user = users.find((u) => u.id === key || u.nick === key);
  if (!user) return { ok: false, error: '找不到这个用户' };
  const hashed = await hashText(pwd);
  if (user.pass !== hashed) return { ok: false, error: '密码不对' };
  setSession(user);
  return { ok: true, user: user };
}

/** 把没有归属的旧胶囊划给某个用户（只做一次迁移） */
async function claimOrphans(store, userId) {
  const all = await store.listCapsules();
  for (const c of all) {
    if (!c.ownerId) {
      c.ownerId = userId;
      try { await store.saveCapsule(c); } catch (err) { /* 忽略 */ }
    }
  }
}

function listThread(a, b) {

  return all().filter((m) => pairKey(m.from, m.to) === k).sort((x, y) => x.ts - y.ts);
}

function lastThread(a, b) {
  const list = listThread(a, b);
  return list.length ? list[list.length - 1] : null;
}

function sendMessage(from, to, text) {
  const t = String(text || '').trim();
  if (!t) return null;
  const arr = all();
  const msg = {
    id: 'msg_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
    from: from,
    to: to,
    text: t.slice(0, 500),
    ts: Date.now()
  };
  arr.push(msg);
  save(arr);
  return msg;
}

function clearThread(a, b) {
  const k = pairKey(a, b);
  save(all().filter((m) => pairKey(m.from, m.to) !== k));
}

/* ---------------- REST ---------------- */
function headers(cfg, extra) {
  return Object.assign({
    apikey: cfg.key,
    Authorization: 'Bearer ' + cfg.key,
    'Content-Type': 'application/json'
  }, extra || {});
}

/* 检查密钥类型：网页里只能用 publishable / anon，secret / service_role 一律不行 */
function keyProblem(key) {
  const k = String(key || '').trim();
  if (k.indexOf('sb_secret_') === 0) {
    return '这是 secret key（服务端密钥），浏览器里不能用。请去 Supabase → Project Settings → API Keys，复制 publishable key（sb_publishable_…）；或展开 Legacy API keys 用 anon public';
  }
  if (k.indexOf('eyJ') === 0) {
    try {
      const parts = k.split('.');
      if (parts.length === 3) {
        const b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        const json = JSON.parse(atob(b64));
        if (json && json.role === 'service_role') {
          return '这是 service_role 密钥（管理员权限），浏览器里不能用。请改用 anon public / publishable key';
        }
      }
    } catch (err) { /* 解析失败就不管 */ }
  }
  return '';
}

async function req(cfg, path, opts) {
  const o = Object.assign({}, opts || {});
  o.headers = headers(cfg, o.headers);
  const pb = keyProblem(cfg.key);
  if (pb) throw new Error(pb);
  let res;
  try {
    res = await fetch(cfg.url + '/rest/v1' + path, o);
  } catch (err) {
    throw new Error('连不上云服务：检查网络是否正常、网址是否填对、Supabase 项目是否被暂停');
  }
  if (!res.ok) {
    let raw = '';
    try { raw = (await res.text()).slice(0, 200); } catch (err) { /* ignore */ }
    let hint = '云端返回错误';
    if (res.status === 401 || res.status === 403) hint = '密钥不对或权限不足：请用 anon public key，并确认建表脚本已执行';
    else if (res.status === 404) hint = '地址不对：Project URL 只填到 https://xxxx.supabase.co，不要带 /rest/v1';
    else if (res.status === 400) hint = '请求被拒绝：请确认 SQL 建表脚本已经执行';
    else if (res.status === 409) hint = '数据重复：这个编号/昵称已存在';
    else if (res.status >= 500) hint = 'Supabase 服务端错误，稍后再试';
    const msg = hint + '（HTTP ' + res.status + '）';
    throw new Error(msg + (raw ? ' · ' + raw.slice(0, 80) : ''));
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function pairOf(a, b) {
  return [String(a), String(b)].sort().join('#');
}

function randHex(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s;
}

function randId(prefix) {
  return prefix + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
}

/* ---------------- 账号 ---------------- */
async function cloudRegister(nick, pass, pass2) {
  const cfg = getConfig();
  if (!cfg) return { ok: false, error: '还没有配置云服务' };
  const name = String(nick || '').trim();
  const pwd = String(pass || '');
  if (name.length < 2 || name.length > 12) return { ok: false, error: '昵称要 2–12 个字' };
  if (pwd.length < 4) return { ok: false, error: '密码至少 4 位' };
  if (pwd !== String(pass2 || '')) return { ok: false, error: '两次密码不一致' };

  try {
    const same = await req(cfg, '/users?select=id&nick=eq.' + encodeURIComponent(name));
    if (Array.isArray(same) && same.length) return { ok: false, error: '这个昵称已经有人用了' };

    const all = await req(cfg, '/users?select=id');
    const count = Array.isArray(all) ? all.length : 0;
    const seq = count + 1;
    const prefix = String(seq).padStart(2, '0');
    const taken = new Set((Array.isArray(all) ? all : []).map((u) => u.id));
    let id = '';
    do { id = randId(prefix); } while (taken.has(id));

    const salt = randHex(12);
    const row = {
      id: id, seq: seq, nick: name, salt: salt,
      pass: await hashText(salt + pwd),
      created_at: new Date().toISOString()
    };
    await req(cfg, '/users', { method: 'POST', body: JSON.stringify(row), headers: { Prefer: 'return=representation' } });
    const user = { id: id, nick: name };
    saveSession(user);
    return { ok: true, user: user };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

async function cloudLogin(account, pass) {
  const cfg = getConfig();
  if (!cfg) return { ok: false, error: '还没有配置云服务' };
  const key = String(account || '').trim();
  if (!key) return { ok: false, error: '请输入编号或昵称' };
  try {
    let rows = [];
    if (/^\d{6,}$/.test(key)) {
      rows = await req(cfg, '/users?select=*&id=eq.' + encodeURIComponent(key));
      if (!rows || !rows.length) rows = await req(cfg, '/users?select=*&nick=eq.' + encodeURIComponent(key));
    } else {
      rows = await req(cfg, '/users?select=*&nick=eq.' + encodeURIComponent(key));
      if (!rows || !rows.length) rows = await req(cfg, '/users?select=*&id=eq.' + encodeURIComponent(key));
    }
    if (!rows || !rows.length) return { ok: false, error: '找不到这个用户' };
    const u = rows[0];
    const hashed = await hashText(String(u.salt || '') + String(pass || ''));
    if (u.pass !== hashed) return { ok: false, error: '密码不对' };
    const user = { id: u.id, nick: u.nick };
    saveSession(user);
    return { ok: true, user: user };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

/** 点掉首页红点：把“已提醒”时间记到当前最新消息时间，之后的新消息会重新亮 */
async function clearHomeNotif(meId) {
  const cfg = getConfig();
  if (!cfg || !getSession() || !meId) return;
  /* 先立即写本机时间，保证红点立刻就灭（不等网络） */
  let all = notifyStore();
  all[meId] = Math.max(Number(all[meId]) || 0, Date.now());
  try { localStorage.setItem(NOTIFY_KEY, JSON.stringify(all)); } catch (err) { /* ignore */ }
  /* 再用云端时间校正一次（失败就忽略） */
  try {
    const rows = await req(cfg, '/messages?select=created_at&to_id=eq.' + encodeURIComponent(meId) + '&order=created_at.desc&limit=1');
    if (rows && rows[0]) {
      const ts = new Date(rows[0].created_at).getTime();
      const cur = notifyStore();
      cur[meId] = Math.max(Number(cur[meId]) || 0, ts);
      try { localStorage.setItem(NOTIFY_KEY, JSON.stringify(cur)); } catch (err) { /* ignore */ }
    }
  } catch (err) { /* ignore */ }
}

/** 首页红点用的未读数：已点掉提醒的消息不再计入 */
async function countUnreadForHome(meId) {
  const cfg = getConfig();
  if (!cfg || !getSession() || !meId) return 0;
  try {
    const rows = await req(cfg, '/messages?select=from_id,created_at&to_id=eq.' + encodeURIComponent(meId) + '&order=created_at.desc&limit=200');
    const read = readStore()[meId] || {};
    const cleared = Number(notifyStore()[meId]) || 0;
    let n = 0;
    for (const r of (rows || [])) {
      const ts = new Date(r.created_at).getTime();
      const seen = Math.max(Number(read[r.from_id]) || 0, cleared);
      if (ts > seen) n++;
    }
    return n;
  } catch (err) {
    return 0;
  }
}

  all[meId] = mine;

function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onload = function () {
      const s = String(fr.result || '');
      resolve(s.slice(s.indexOf(',') + 1));
    };
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || 'application/octet-stream' });
}

async function pushMedia(meId, capsuleId, meta, blob) {
  const cfg = getConfig();
  const s = getSession();
  if (!cfg || !s) return { ok: false, error: '未登录' };
  if (!blob) return { ok: false, error: '没有文件' };
  if (blob.size > MEDIA_MAX) return { ok: false, error: '文件超过 4MB' };
  try {
    const b64 = await blobToBase64(blob);
    const total = Math.ceil(b64.length / MEDIA_CHUNK) || 1;
    for (let i = 0; i < total; i++) {
      const row = {
        id: 'media_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 5) + '_' + i,
        pair: mediaPair(capsuleId, meta.id),
        from_id: meId,
        to_id: 'media',
        text: JSON.stringify({
          c: capsuleId, m: meta.id, k: meta.kind, name: meta.name || '', type: meta.type || '',
          size: meta.size || blob.size, duration: meta.duration || null,
          i: i, n: total, d: b64.slice(i * MEDIA_CHUNK, (i + 1) * MEDIA_CHUNK)
        }),
        created_at: new Date().toISOString()
      };
      await req(cfg, '/messages', { method: 'POST', body: JSON.stringify(row), headers: { Prefer: 'return=minimal' } });
    }
    return { ok: true, chunks: total };
  } catch (err) {
    return { ok: false, error: String(err.message || err) };
  }
}

async function pullMedia(meId, capsuleId, meta) {
  const cfg = getConfig();
  if (!cfg || !getSession()) return null;
  try {
    const rows = await req(cfg, '/messages?select=text&pair=eq.' + encodeURIComponent(mediaPair(capsuleId, meta.id)) + '&order=created_at.asc&limit=200');
    if (!rows || !rows.length) return null;
    const parts = [];
    let info = null;
    for (const r of rows) {
      const p = JSON.parse(r.text);
      info = info || p;
      parts[p.i] = p.d;
    }
    for (let i = 0; i < parts.length; i++) if (parts[i] === undefined) return null;
    return b64ToBlob(parts.join(''), info ? info.type : '');
  } catch (err) {
    return null;
  }
}

/* ---------------- 修改昵称（7 天冷却） ---------------- */
const RENAME_COOL_DAYS = 7;

async function getRenameInfo() {
  const cfg = getConfig();
  const s = getSession();
  if (!cfg || !s) return null;
  try {
    const rows = await req(cfg, '/users?select=nick,nick_updated_at&id=eq.' + encodeURIComponent(s.id));
    if (!rows || !rows.length) return null;
    const row = rows[0];
    const last = row.nick_updated_at ? new Date(row.nick_updated_at).getTime() : 0;
    const cool = RENAME_COOL_DAYS * 24 * 3600 * 1000;
    const left = last ? Math.max(0, cool - (Date.now() - last)) : 0;
    return { nick: row.nick, last: last, daysLeft: Math.ceil(left / 86400000), canChange: left <= 0 };
  } catch (err) {
    return null;
  }
}

async function renameMe(newNick) {
  const cfg = getConfig();
  const s = getSession();
  if (!cfg) return { ok: false, error: '还没有配置云服务' };
  if (!s) return { ok: false, error: '请先登录' };
  const name = String(newNick || '').trim();
  if (name.length < 2) return { ok: false, error: '昵称至少 2 个字' };
  if (name.length > 12) return { ok: false, error: '昵称最多 12 个字' };
  try {
    const rows = await req(cfg, '/users?select=id,nick,nick_updated_at&id=eq.' + encodeURIComponent(s.id));
    if (!rows || !rows.length) return { ok: false, error: '云端找不到这个账号' };
    const me = rows[0];
    if (me.nick === name) return { ok: false, error: '新昵称和现在一样' };

    const last = me.nick_updated_at ? new Date(me.nick_updated_at).getTime() : 0;
    const cool = RENAME_COOL_DAYS * 24 * 3600 * 1000;
    if (last && (Date.now() - last) < cool) {
      const days = Math.ceil((cool - (Date.now() - last)) / 86400000);
      return { ok: false, error: '改名冷却中：还要等 ' + days + ' 天才能再改' };
    }

    const dup = await req(cfg, '/users?select=id&nick=eq.' + encodeURIComponent(name));
    if (Array.isArray(dup) && dup.length) return { ok: false, error: '这个昵称已经有人用了' };

    await req(cfg, '/users?id=eq.' + encodeURIComponent(s.id), {
      method: 'PATCH',
      body: JSON.stringify({ nick: name, nick_updated_at: new Date().toISOString() }),
      headers: { Prefer: 'return=representation' }
    });
    localStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify({ id: s.id, nick: name }));
    return { ok: true, user: { id: s.id, nick: name } };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

  let pressTimer = null;
