  const SAD_LINES = ['有些人，只适合留在信里。', '喜欢是真的，遗憾也是真的。', '想说的话，都寄给未来了。'];

  const pickSadLine = () => {
    try {
      const hour = new Date().getHours();
      if (weatherState && weatherState.ok && weatherState.fx && weatherState.fx.rain) {
        return '雨下得很大，像那天一样。';
      }
      if (hour >= 23 || hour < 4) {
        return '这么晚了，还在想谁。';
      }
    } catch (err) { /* ignore */ }
    return SAD_LINES[Math.floor(Math.random() * SAD_LINES.length)];
  };

  const clearSad = () => {
    if (sadBubble) { sadBubble.remove(); sadBubble = null; }
    fabFace.innerHTML = avatarSvg(normalAvatar);
  };

  const meFab = h('button', {
    class: 'me-fab', type: 'button', 'aria-label': '我的', title: '我的',
    onclick: () => {
      if (suppressClick) { suppressClick = false; return; }
      ctx.navigate('me');
    }
  }, fabFace);

  meFab.addEventListener('pointerdown', () => {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      suppressClick = true;
      fabFace.innerHTML = avatarSvg('crying');
      if (sadBubble) sadBubble.remove();
      const line = pickSadLine();
      sadBubble = h('div', { class: 'me-sad' }, h('span', { class: 'ms-line', text: line }));
      const screenEl = document.querySelector('.screen');
      if (screenEl) screenEl.append(sadBubble);
      setTimeout(clearSad, 9000);
    }, 2000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
    meFab.addEventListener(ev, () => clearTimeout(pressTimer));
  });
  meFab.addEventListener('contextmenu', (e) => e.preventDefault());

  const meTip = h('button', {
    class: 'me-notify', id: 'meTip', type: 'button', hidden: true,
    onclick: () => ctx.navigate('chat')
  }, '');

  scroll.append(
    h('div', { class: 'home-head' },
      h('div', { class: 'brand', text: '时间胶囊' }),
      h('div', { class: 'store', text: '已存于本机 · ' + (ctx.version || '') })
    ),
    h('div', {
      class: 'clock center',
      onclick: () => {
        if (!authorBday) return;
        const t = Date.now();
        if (t - lastTapAt > 1400) clockTaps = 0;
        lastTapAt = t;
        clockTaps += 1;
        if (clockTaps >= 5) { clockTaps = 0; openSecretLetter(() => ctx.render()); }
      }
    },
      h('span', { dataset: { clockHm: '' } }, fmtHM(new Date())),
      h('span', { class: 'secs', dataset: { clockSec: '' } }, pad2(new Date().getSeconds()))
    ),
    h('div', { class: 'date center', dataset: { clockDate: '' } }, fmtDateCN(new Date()))
  );

  if (weatherState.ok) {
    scroll.append(h('button', {
      class: 'weather-line',
      title: '点一下修改天气地址',
      onclick: () => weatherOpenPlaceDialog(() => ctx.render())
    },
      h('span', { class: 'w-ico', html: weatherChipSvg(15) }),
      h('span', { text: weatherLabel() })
    ));
  }

  const confetti = authorBday ? confettiEl() : null;
  if (nineFeb) {
    scroll.append(h('div', { class: 'quote-card' + (midnight ? ' quote-midnight' : '') },
      h('div', { class: 'qc-line', text: 'Even if I were to leap into the Black River, the sea of hatred, and the heavens of sorrow, I would still crash against the southern wall where rain becomes a burial ground.' }),
      midnight ? h('div', { class: 'qc-extra', text: '零点 · 把这句话留给这一天。' }) : null,
      h('div', { class: 'qc-date', text: midnight ? '2 · 9 · 0:00' : '2 · 9' })
    ));
  }
  if (nowDate.getHours() < 5) scroll.append(buildQCard(ctx, nowDate));
  if (authorBday) scroll.append(buildAuthorCard(ctx));

  if (fest) {
    scroll.append(h('div', { class: 'festival' },
      h('span', { class: 'fest-ico', html: avatarSvg(fest.avatar) }),
      h('div', { class: 'fest-body' },
        h('div', { class: 'fest-title', text: fest.greeting }),
        h('div', { class: 'fest-sub', text: fest.sub })
      )
    ));
  }

  if (!hasAny) {
    scroll.append(
      h('div', { class: 'empty' },
        h('div', { class: 'eico', html: svg('envelope') }),
        h('div', { class: 'eh', text: '还没有埋下第一封' }),
        h('div', { class: 'ep' }, '选一个未来的日期，写点什么，然后封起来。', h('br'), '不到那天，连你自己也打不开。'),
        h('button', { class: 'btn btn-primary', onclick: () => ctx.actions.startDraft() }, '＋ 埋第一封胶囊')
      )
    );
    return h('section', { class: 'screen' }, scroll, meTip, meFab, confetti, renderTabbar('home', {
      onHome: () => ctx.navigate('home'),
      onTime: () => ctx.navigate('time'),
      onNew: () => ctx.actions.startDraft()
    }));
  }

  if (due.length) {
    const c = due[0];
    scroll.append(
      h('button', { class: 'due-banner', onclick: () => ctx.actions.openCapsule(c.id) },
        h('span', { class: 'seal-dot' }),
        h('div', { class: 'due-t' }, h('b', { text: due.length > 1 ? '有 ' + due.length + ' 封到期了' : '有 1 封到期了' }), h('span', { text: c.title || '未命名' })),
        h('div', { class: 'due-go', text: '去开启 ›' })
      )
    );
  }

  if (next) {
    scroll.append(
      h('button', { class: 'next-card', onclick: () => ctx.actions.openCapsule(next.id) },
        h('div', { class: 'nc-label', text: '下一封开启' }),
        h('div', { class: 'nc-count', dataset: { countdownLong: String(next.unlockAt) }, text: countdownLong(next.unlockAt - now) }),
        h('div', { class: 'nc-title', text: next.title || '未命名' }),
        h('div', { class: 'nc-meta', text: fmtDateTime(next.unlockAt) + ' 开启' })
      )
    );
  }

  const stats = h('div', { class: 'stats' },
    h('button', {
      onclick: () => {
        const anchor = document.getElementById('sec-sealed');
        if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, h('b', { text: String(sealed.length) }), h('span', { text: '封存中' })),
    h('button', {
      onclick: () => {
        const anchor = document.getElementById('sec-opened');
        if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, h('b', { text: String(opened.length) }), h('span', { text: '已开启' })),
    h('button', {
      onclick: () => {
        if (drafts.length) ctx.actions.openDraft(drafts[0].id);
        else ctx.actions.startDraft();
      }
    }, h('b', { text: String(drafts.length) }), h('span', { text: '草稿' }))
  );
  scroll.append(stats);

  if (drafts.length) {
    const d = drafts[0];
    scroll.append(
      h('button', { class: 'draft', onclick: () => ctx.actions.openDraft(d.id) },
        h('span', { class: 'd-it', text: '草稿' }),
        h('span', { class: 'd-text', text: (d.title || '还没想好标题') + ' · 继续写' })
      )
    );
  }

  if (sealed.length) {
    scroll.append(h('div', { class: 'sec', id: 'sec-sealed' }, h('span', { text: '封 存 中' }), h('em', { text: '按开启时间' })));
    for (const c of sealed) scroll.append(itemEl(c, ctx, now));
  }

  if (opened.length) {
    scroll.append(h('div', { class: 'sec', id: 'sec-opened' }, h('span', { text: '已 开 启' })));
    for (const c of opened) scroll.append(itemEl(c, ctx, now));
  }

  return h('section', { class: 'screen' }, scroll, meTip, meFab, confetti, renderTabbar('home', {
    onHome: () => ctx.navigate('home'),
    onTime: () => ctx.navigate('time'),
    onNew: () => ctx.actions.startDraft()
  }));
}

/* ==================== src\screens\time.js ==================== */
/* P2 时间显示：大钟 + 时间轴 */




function nowlineEl() {
  return h('div', { class: 'nowline' }, h('span', { text: '现 在' }));
}

function nodeEl(cap, ctx, now) {
  const isOpened = cap.status === 'opened';
  const isDue = !isOpened && cap.unlockAt <= now;
  const cls = 'tn' + (isOpened ? ' done' : '') + (isDue ? ' due' : '');
  let status;
  if (isOpened) status = '已开启';
  else if (isDue) status = '已到期 · 去开启';
  else status = '还有 ' + countdownText(cap.unlockAt - now);

  return h('button', { class: cls, onclick: () => ctx.actions.openCapsule(cap.id) },
    h('span', { class: 'dot' }),
    h('div', null,
      h('div', { class: 't', text: cap.title || '未命名' }),
      h('div', { class: 'm', text: fmtDateTime(cap.unlockAt) + ' · ' + status })
    )
  );
}

function renderTime(ctx) {
  const now = Date.now();
  const caps = ctx.capsules.filter((c) => c.status !== 'draft').sort((a, b) => a.unlockAt - b.unlockAt);
  const next = caps.find((c) => c.status === 'sealed' && c.unlockAt > now) || null;
  const mode = ctx.state.timeMode === 'next' ? 'next' : 'now';

  const scroll = h('div', { class: 'scroll' });

  scroll.append(
    h('div', { class: 'home-head' },
      h('div', { class: 'brand', text: mode === 'next' ? '下一封倒计时' : '现在' }),
      h('div', { class: 'store', text: '本机时间' })
    )
  );

  if (mode === 'now') {
    scroll.append(
      h('div', { class: 'clock' },
        h('span', { dataset: { clockHm: '' } }, fmtHM(new Date())),
        h('span', { class: 'secs', dataset: { clockSec: '' } }, pad2(new Date().getSeconds()))
      ),
      h('div', { class: 'date', dataset: { clockDate: '' } }, fmtDateCN(new Date()))
    );
  } else if (next) {
    scroll.append(
      h('div', { class: 'countdown-big', dataset: { countdownLong: String(next.unlockAt) }, text: countdownLong(next.unlockAt - now) }),
      h('div', { class: 'date', text: '到 ' + fmtDateTime(next.unlockAt) + ' 开启' })
    );
  } else {
    scroll.append(
      h('div', { class: 'countdown-big', text: '还没有安排' }),
      h('div', { class: 'date', text: '埋一封带日期的心，这里就会有倒计时' })
    );
  }

  scroll.append(
    h('div', { class: 'chips' },
      h('button', { class: 'chip' + (mode === 'now' ? ' on' : ''), onclick: () => ctx.navigate('time', { timeMode: 'now' }) }, '现在'),
      h('button', { class: 'chip' + (mode === 'next' ? ' on' : ''), onclick: () => ctx.navigate('time', { timeMode: 'next' }) }, '下一封倒计时')
    )
  );

  if (next) {
    scroll.append(
      h('button', { class: 'nextline', onclick: () => ctx.actions.openCapsule(next.id) },
        h('div', { style: 'min-width:0' },
          h('div', { class: 't', text: next.title || '未命名' }),
          h('div', { class: 'm', text: fmtDateTime(next.unlockAt) })
        ),
        h('div', { class: 'cd', dataset: { countdownLong: String(next.unlockAt) }, text: countdownLong(next.unlockAt - now) })
      )
    );
  }

  if (!caps.length) {
    scroll.append(
      h('div', { class: 'empty' },
        h('div', { class: 'eico', html: svg('clock') }),
        h('div', { class: 'eh', text: '时间轴上还没有东西' }),
        h('div', { class: 'ep' }, '埋下第一封之后，它会出现在这里。'),
        h('button', { class: 'btn btn-primary', onclick: () => ctx.actions.startDraft() }, '＋ 埋第一封胶囊')
      )
    );
  } else {
    scroll.append(h('div', { class: 'sec' }, h('span', { text: '时 间 轴' }), h('em', { text: '按开启日期' })));
    const tl = h('div', { class: 'tl' });
    let lastMonth = null;
    let nowInserted = false;
    for (const cap of caps) {
      if (!nowInserted && cap.unlockAt > now) {
        tl.append(nowlineEl());
        nowInserted = true;
      }
      const month = fmtMonthCN(cap.unlockAt);
      if (month !== lastMonth) {
        tl.append(h('div', { class: 'tlm', text: month }));
        lastMonth = month;
      }
      tl.append(nodeEl(cap, ctx, now));
    }
    if (!nowInserted) tl.append(nowlineEl());
    scroll.append(tl);
  }

  return h('section', { class: 'screen' }, scroll, renderTabbar('time', {
    onHome: () => ctx.navigate('home'),
    onTime: () => ctx.navigate('time', { timeMode: ctx.state.timeMode }),
    onNew: () => ctx.actions.startDraft()
  }));
}

/* ==================== src\screens\editor.js ==================== */
/* P3 编辑：写、配图/视频、定开启时间、封存 */






function uidMedia() {
  return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

function renderEditor(ctx) {
  const cap = ctx.capsules.find((c) => c.id === ctx.state.editorId);
  if (!cap) {
    return h('section', { class: 'screen' },
      h('div', { class: 'empty' },
        h('div', { class: 'eh', text: '这封胶囊不在了' }),
        h('button', { class: 'btn btn-primary', onclick: () => ctx.navigate('home') }, '回到首页')
      )
    );
  }

  let saveTimer = null;
  let lastSavedAt = cap.updatedAt || Date.now();
  const hasTitle = !!(cap.title || '').trim();

  /* ---------- 顶部 ---------- */
  const appbar = h('header', { class: 'appbar' },
    h('button', { onclick: onCancel }, '取消'),
    h('div', { class: 'mid', text: hasTitle ? '继续写' : '新胶囊' }),
    h('button', { class: 'r', onclick: onPreview }, '预览')
  );

  /* ---------- 文字 ---------- */
  const titleInput = h('input', {
    class: 'title-in', type: 'text', maxlength: '30',
    placeholder: '给未来的自己起个标题',
    oninput: () => {
      cap.title = titleInput.value;
      scheduleSave();
    }
  });
  titleInput.value = cap.title || '';

  const bodyInput = h('textarea', {
    class: 'body-in', rows: '4',
    placeholder: '想对未来的自己说点什么……',
    oninput: () => {
      cap.body = bodyInput.value;
      autosize();
      updateCount();
      scheduleSave();
    }
  });
  bodyInput.value = cap.body || '';

  function autosize() {
    bodyInput.style.height = 'auto';
    bodyInput.style.height = Math.max(132, bodyInput.scrollHeight) + 'px';
  }

  const countWord = h('span', { class: 'k', text: '0 字' });
  function updateCount() {
    const n = (cap.body || '').replace(/\s+/g, '').length;
    countWord.textContent = n + ' 字';
  }

  const savedLabel = h('span', { class: 'saved', text: '已自动保存' });

  function scheduleSave() {
    savedLabel.textContent = '正在保存…';
    savedLabel.className = 'saving';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 700);
  }

  async function persist() {
    clearTimeout(saveTimer);
    saveTimer = null;
    cap.updatedAt = Date.now();
    try {
      await store.saveCapsule(cap);
      lastSavedAt = cap.updatedAt;
      savedLabel.textContent = '已自动保存 · ' + fmtTime(lastSavedAt);
      savedLabel.className = 'saved';
      updateField();
    } catch (err) {
      savedLabel.textContent = '保存失败';
      savedLabel.className = 'saving';
      toast('保存失败：' + err.message);
    }
  }

  ctx.registerFlush(() => {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; persist(); }
  });

  /* ---------- 附件 ---------- */
  const mediaCount = h('em', { text: '' });
  const grid = h('div', { class: 'grid' });

  function updateMediaMeta() {
    const videos = cap.media.filter((m) => m.kind === 'video').length;
    let text = cap.media.length + ' / ' + LIMITS.MAX_MEDIA;
    if (videos) text += ' · 含视频 ' + videos + ' 段';
    if (!cap.media.length) text = '图片或视频，最多 9 个';
    mediaCount.textContent = text;
  }

  async function renderGrid() {
    grid.textContent = '';
    for (const m of cap.media) {
      const cell = h('div', { class: 'cell' + (m.kind === 'video' ? ' vid' : ''), onclick: () => openViewer(m) });
      if (m.kind === 'video') {
        cell.append(
          h('span', { class: 'play', html: svg('play') }),
          h('span', { class: 'dur', text: m.duration ? fmtDurationText(m.duration) : '' })
        );
      }
      const del = h('button', {
        class: 'del', html: '×', 'aria-label': '移除', title: '移除',
        onclick: (e) => { e.stopPropagation(); removeMedia(m); }
      });
      cell.append(del);
      grid.append(cell);

      (async () => {
        try {
          const key = m.kind === 'video' ? 'poster_' + m.id : 'img_' + m.id;
          const blob = m.kind === 'video' ? await store.getPoster(m.id) : await store.getBlob(m.id);
          if (!blob) return;
          const img = h('img', { alt: '' });
          img.src = urlFor(key, blob);
          cell.prepend(img);
        } catch (err) { /* 留空白格 */ }
      })();
    }
    if (cap.media.length < LIMITS.MAX_MEDIA) {
      grid.append(h('div', { class: 'cell add', html: svg('plus'), onclick: onAdd, title: '添加图片或视频' }));
    }
    updateMediaMeta();
  }

  function fmtDurationText(sec) {
    const s = Math.max(0, Math.round(sec));
    const m = Math.floor(s / 60);
    return (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  async function onAdd() {
    toast('正在打开选择器…');
    const files = await pickFiles();
    if (!files || !files.length) return;

    for (const file of files) {
      if (cap.media.length >= LIMITS.MAX_MEDIA) {
        toast('最多 9 个附件，这些先不放了');
        break;
      }
      const kind = fileKind(file);
      if (!kind) { toast('只支持图片和视频'); continue; }

      if (kind === 'image') {
        if (file.size > LIMITS.MAX_IMAGE) { toast('这张图超过 10MB 了'); continue; }
        const id = uidMedia();
        try {
          await store.saveBlob({ id: id, capsuleId: cap.id, blob: file });
        } catch (err) {
          toast('保存图片失败：' + (err.name === 'QuotaExceededError' ? '本机空间不足' : err.message));
          continue;
        }
        cap.media.push({ id: id, kind: 'image', name: file.name, type: file.type, size: file.size, duration: null });
        await store.saveCapsule(cap);
        await renderGrid();
      } else {
        if (file.size > LIMITS.MAX_VIDEO) { toast('这段视频超过 200MB 了'); continue; }
        const videos = cap.media.filter((m) => m.kind === 'video').length;
        if (videos >= LIMITS.MAX_VIDEOS) { toast('一封胶囊最多放 3 段视频，这段先不放了'); continue; }

        const id = uidMedia();
        const loading = h('div', { class: 'cell loading', text: '读取视频…' });
        grid.append(loading);
        toast('正在读取视频…', 1200);

        let poster = null;
        let duration = null;
        try {
          const meta = await makePoster(file);
          poster = meta.poster;
          duration = meta.duration;
        } catch (err) { /* 截帧失败不阻塞 */ }

        try {
          await store.saveBlob({ id: id, capsuleId: cap.id, blob: file });
          if (poster) await store.savePoster({ id: id, capsuleId: cap.id, blob: poster });
        } catch (err) {
          loading.remove();
          toast('保存视频失败：' + (err.name === 'QuotaExceededError' ? '本机空间不足' : err.message));
          continue;
        }

        cap.media.push({
          id: id, kind: 'video', name: file.name, type: file.type,
          size: file.size, duration: duration
        });
        await store.saveCapsule(cap);
        loading.remove();
        await renderGrid();
      }
    }
    updateMediaMeta();
  }

  async function removeMedia(m) {
    cap.media = cap.media.filter((x) => x.id !== m.id);
    try {
      await store.deleteMedia(m.id);
      await store.saveCapsule(cap);
    } catch (err) {
      toast('移除失败：' + err.message);
    }
    release('img_' + m.id);
    release('poster_' + m.id);
    release('lb_' + m.id);
    await renderGrid();
  }

  /* ---------- 开启时间 ---------- */
  const field = h('button', { class: 'field', onclick: openTimeSheet });
  function updateField() {
    field.textContent = '';
    field.append(
      h('div', { class: 'row' },
        h('span', { class: 'k', text: '什么时候可以打开' }),
        h('span', { class: 'k', text: cap.unlockAt ? '' : '必选' })
      ),
      cap.unlockAt
        ? h('div', { class: 'val', text: fmtDateTime(cap.unlockAt) })
        : h('div', { class: 'val empty', text: '点击选择日期和时间' })
    );
  }

  function openTimeSheet() {
    const base = cap.unlockAt || (Date.now() + 24 * 60 * 60 * 1000);
    const dateInput = h('input', { type: 'date', value: fmtDate(base) });
    const timeInput = h('input', { type: 'time', value: fmtTime(base) });
    const quick = h('div', { class: 'quick' });
    for (const opt of quickUnlockOptions(Date.now())) {
      quick.append(h('button', {
        onclick: () => {
          dateInput.value = fmtDate(opt.ts);
          timeInput.value = fmtTime(opt.ts);
        }
      }, opt.label));
    }

    const sheet = h('div', { class: 'sheet' },
      h('div', { class: 'sh-title', text: '什么时候可以打开' }),
      h('div', { class: 'sh-hint', text: '至少要在 1 分钟之后；封存后不能修改' }),
      quick,
      h('div', { class: 'dt-row' },
        h('label', null, h('span', { text: '日期' }), dateInput),
        h('label', null, h('span', { text: '时间' }), timeInput)
      ),
      h('div', { class: 'sheet-btns' },
        h('button', { class: 'btn btn-ghost', onclick: closeLayer }, '取消'),
        h('button', {
          class: 'btn btn-primary',
          onclick: async () => {
            const ts = new Date(dateInput.value + 'T' + (timeInput.value || '00:00')).getTime();
            if (!isAllowedUnlock(ts)) { toast('要选 1 分钟之后的时间'); return; }
            cap.unlockAt = ts;
            cap.updatedAt = Date.now();
            closeLayer();
            updateField();
            await persist();
          }
        }, '确定')
      )
    );
    openLayer(sheet);
  }

  /* ---------- 底部动作 ---------- */
  const sealBtn = h('button', { class: 'btn btn-primary btn-block', onclick: doSeal }, '封存这封胶囊');

  async function doSeal() {
    if (!(cap.title || '').trim() && !(cap.body || '').trim()) { toast('先写点什么再封存'); return; }
    if (!cap.unlockAt) { toast('先选一个开启时间'); return; }
    if (!isAllowedUnlock(cap.unlockAt)) { toast('开启时间要在 1 分钟之后'); return; }
    savedLabel.textContent = '正在保存…';
    await persist();
    await ctx.actions.seal(cap);
  }

  async function onPreview() {
    await persist();
    ctx.navigate('preview', { previewId: cap.id });
  }

  async function onCancel() {
    await persist();
    const hasContent = !!((cap.title || '').trim() || (cap.body || '').trim() || cap.media.length);
    if (!hasContent) {
      await ctx.actions.discardDraft(cap);
      ctx.navigate('home');
      return;
    }
    const choice = await choiceDialog({
      title: '这封还没封存',
      message: '草稿会留在首页，下次可以继续写。',
      options: [
        { text: '保存草稿并退出', value: 'save', kind: 'primary' },
        { text: '丢弃这封草稿', value: 'discard', kind: 'danger' },
        { text: '继续编辑', value: 'stay' }
      ]
    });
    if (choice === 'discard') {
      await ctx.actions.discardDraft(cap);
      toast('已丢弃草稿');
      ctx.navigate('home');
    } else if (choice === 'save') {
      ctx.navigate('home');
    }
  }

  /* ---------- 组装 ---------- */
  updateCount();
  updateField();
  renderGrid();
  updateMediaMeta();

  const bridgeOn = !!(typeof window !== 'undefined' && window.AndroidPicker);
  const mediaHint = h('div', { class: 'media-hint' },
    (bridgeOn ? 'App 桥接：可用' : '网页版（用系统文件选择）') + ' · ' + (ctx.version || '')
  );
  const pickBtn = h('button', { class: 'btn btn-ghost btn-block media-pick-btn', onclick: onAdd },
    '从相册添加图片 / 视频'
  );
  const scroll = h('div', { class: 'scroll editor-scroll' },
    titleInput,
    bodyInput,
    h('div', { class: 'count' }, savedLabel, countWord),
    h('div', { class: 'sec' }, h('span', { text: '图 片 / 视 频' }), mediaCount),
    mediaHint,
    pickBtn,
    grid,
    field,
    h('div', { class: 'autosave', text: '草稿只存在这台电脑上，不会上传' })
  );

  const section = h('section', { class: 'screen' }, appbar, scroll,
    h('div', { class: 'dock' }, sealBtn)
  );

  requestAnimationFrame(() => {
    autosize();
    savedLabel.textContent = '已自动保存 · ' + fmtTime(lastSavedAt);
  });

  return section;
}

function renderDetail(ctx) {
  const cap = ctx.capsules.find((c) => c.id === ctx.state.detailId);
  if (!cap) {
    return h('section', { class: 'screen' },
      h('div', { class: 'empty' },
        h('div', { class: 'eh', text: '这封胶囊不在了' }),
        h('button', { class: 'btn btn-primary', onclick: () => ctx.navigate('home') }, '回到首页')
      )
    );
  }

  const now = Date.now();
  const isSealed = cap.status === 'sealed';
  const home = () => ctx.navigate('home');

  const appbar = h('header', { class: 'appbar' },
    h('button', { onclick: home }, '‹ 返回'),
    h('div', { class: 'mid', text: isSealed ? '封存中' : '已开启' }),
    h('span', { class: 'placeholder' })
  );

  if (isSealed) {
    const scroll = h('div', { class: 'scroll center' },
      h('div', { class: 'detail-lock', html: svg('lock') }),
      h('div', { class: 'h1 detail-title', text: cap.title || '未命名' }),
      h('div', { class: 'detail-dates', text: '封存于 ' + fmtDateTime(cap.sealedAt || cap.createdAt) + ' · ' + fmtDateTime(cap.unlockAt) + ' 开启' }),
      h('div', { class: 'count-card' },
        h('div', { class: 'k', text: '距离开启' }),
        h('div', { class: 'big', dataset: { countdownLong: String(cap.unlockAt) }, text: countdownLong(cap.unlockAt - now) })
      ),
      h('div', { class: 'masked' },
        h('div', { class: 'mk', text: '正文与附件已封存' }),
        h('div', { class: 'blur' }),
        h('div', { class: 'blur' }),
        h('div', { class: 'blur s' })
      ),
      h('div', { class: 'autosave', text: '到期后自动解锁，不需要任何操作' })
    );

    return h('section', { class: 'screen' },
      appbar,
      scroll,
      h('div', { class: 'dock' },
        h('button', { class: 'btn btn-ghost aside', onclick: () => ctx.actions.deleteCapsule(cap) }, '删除'),
        h('button', { class: 'btn', onclick: home }, '返回首页')
      )
    );
  }

  /* 已开启 */
  const justOpened = ctx.state.justOpened === cap.id;
  if (justOpened) ctx.state.justOpened = null;

  const paras = (cap.body || '').split(/\n+/).filter((t) => t.trim());
  const content = h('div', { class: justOpened ? 'reveal' : '' },
    h('div', { class: 'from', text: '来自 ' + fmtDate(cap.createdAt) + ' 的你' }),
    h('div', { class: 'title-wrap' },
      h('div', { class: 'seal-stamp', text: '封' }),
      h('div', { class: 'h1', text: cap.title || '未命名' })
    ),
    h('div', { class: 'dates', text: '封存于 ' + fmtDateTime(cap.sealedAt || cap.createdAt) + ' · 开启于 ' + fmtDateTime(cap.openedAt || now) })
  );

  if (paras.length) {
    for (const t of paras) content.append(h('p', { class: 'p', text: t }));
  } else {
    content.append(h('p', { class: 'p muted', text: '（这封信没有写正文）' }));
  }

  const grid = renderMediaGrid(cap);
  if (grid) content.append(grid);
  if (cap.mediaMissing > 0) {
    content.append(h('p', { class: 'p muted', text: '这封信还有 ' + cap.mediaMissing + ' 个图片/视频，只存在写下它的那台设备上，没有同步过来。' }));
  }

  const scroll = h('div', { class: 'scroll detail-scroll' }, content);

  return h('section', { class: 'screen' },
    appbar,
    scroll,
    h('div', { class: 'dock' },
      h('button', { class: 'btn btn-ghost aside', onclick: () => ctx.actions.deleteCapsule(cap) }, '删除'),
      h('button', { class: 'btn btn-primary', onclick: home }, '完成')
    )
  );
}

  cloud.getRenameInfo().then(function (i) {
    if (!i) { info.textContent = '每个账号改完昵称后，7 天内不能再次修改。'; return; }
    info.textContent = i.canChange
      ? '可以修改昵称（每个账号 7 天只能改一次）。'
      : '上次改名于 ' + new Date(i.last).toLocaleDateString() + '，还要等 ' + i.daysLeft + ' 天才能再改。';
  });

  const dlg = h('div', { class: 'dialog' },

    h('label', { class: 'auth-field' }, h('span', { class: 'auth-label', text: '新昵称' }), input),
    info,
    status,
    h('div', { class: 'dbtns' },
      h('button', { class: 'btn btn-ghost', onclick: closeLayer }, '取消'),
      h('button', {
        class: 'btn btn-primary',
        onclick: async () => {
          status.textContent = '保存中…';
          const res = await cloud.renameMe(input.value);
          if (!res.ok) { status.textContent = res.error; return; }
          closeLayer();
          toast('昵称已改为「' + res.user.nick + '」');
          if (ctx.state.user) ctx.state.user.nick = res.user.nick;
          ctx.render();
        }
      }, '保存')

  );
  openLayer(dlg, { onBackdrop: () => closeLayer() });
}

/* ==================== src\screens\auth.js ==================== */
/* 登录 / 注册界面 */




function field(label, input) {
  return h('label', { class: 'auth-field' },
    h('span', { class: 'auth-label', text: label }),
    input
  );
}

function renderAuth(ctx) {
  const root = h('section', { class: 'screen auth-screen' });
  let mode = 'login';
  let error = '';

  function render() {
    root.textContent = '';
    root.append(build());
  }

  function build() {
    const isLogin = mode === 'login';
    const err = h('div', { class: 'auth-error', text: error });

    const account = h('input', {
      class: 'auth-input', type: 'text', autocomplete: 'off',
      placeholder: '编号（如 012345）或昵称'
    });
    const password = h('input', {
      class: 'auth-input', type: 'password', autocomplete: 'off', placeholder: '密码'
    });
    const nick = h('input', {
      class: 'auth-input', type: 'text', maxlength: '12', autocomplete: 'off',
      placeholder: '给自己起个昵称'
    });
    const pass1 = h('input', { class: 'auth-input', type: 'password', autocomplete: 'off', placeholder: '密码（至少 4 位）' });
    const pass2 = h('input', { class: 'auth-input', type: 'password', autocomplete: 'off', placeholder: '再输一次密码' });

    async function submit() {
      error = '';
      const cloudOn = cloud.isConfigured();
      let res;
      if (isLogin) {
        res = cloudOn ? await cloud.cloudLogin(account.value, password.value) : await login(account.value, password.value);
      } else {
        res = cloudOn
          ? await cloud.cloudRegister(nick.value, pass1.value, pass2.value)
          : await register(nick.value, pass1.value, pass2.value);
      }
      if (!res.ok && cloudOn && isLogin && res.error === '找不到这个用户') {
        // 旧版本的本机账号：校验通过后自动在云端建同名账号，实现迁移
        const local = await login(account.value, password.value);
        if (local.ok) {
          const reg = await cloud.cloudRegister(local.user.nick, password.value, password.value);
          if (reg.ok) {
            toast('已把本机账号迁移到云端 · 新编号 ' + reg.user.id, 3200);
            ctx.actions.afterAuth(reg.user);
            return;
          }
          error = '检测到本机旧账号，但云端创建失败：' + reg.error;
          render();
          return;
        }
      }
      if (!res.ok) {
        error = res.error === '找不到这个用户'
          ? '找不到这个用户。如果你之前用的是本机账号，请用原来的编号+密码登录，会自动迁移到云端'
          : res.error;
        render();
        return;
      }
      toast((isLogin ? '欢迎回来，' : '注册成功 · 编号 ') + (isLogin ? res.user.nick : res.user.id), isLogin ? 1900 : 2600);
      ctx.actions.afterAuth(res.user);
    }

    function keydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    }
    [account, password, nick, pass1, pass2].forEach((el) => el.addEventListener('keydown', keydown));

    const submitBtn = h('button', { class: 'btn btn-primary btn-block', onclick: submit },
      isLogin ? '登 录' : '注 册 并 进 入');

    const form = h('div', { class: 'auth-card' },
      h('div', { class: 'auth-tabs' },
        h('button', {
          class: 'auth-tab' + (isLogin ? ' on' : ''),
          onclick: () => { mode = 'login'; error = ''; render(); }
        }, '登录'),
        h('button', {
          class: 'auth-tab' + (isLogin ? '' : ' on'),
          onclick: () => { mode = 'register'; error = ''; render(); }
        }, '注册')
      ),
      isLogin
        ? [
          field('编号 / 昵称', account),
          field('密码', password)
        ]
        : [
          field('昵称', nick),
          field('密码', pass1),
          field('确认密码', pass2),
          h('div', { class: 'auth-note', text: '注册后会自动分配一个 6 位专属编号（按注册顺序 + 随机数字）' })
        ],
      err,
      submitBtn
    );

    const count = userCount();
    return h('div', { class: 'auth-wrap' },
      h('div', { class: 'auth-brand' },
        h('div', { class: 'auth-face', html: svg('cartoon') }),
        h('div', { class: 'auth-title', text: '时间胶囊' }),
        h('div', { class: 'auth-sub', text: count > 0 ? '本机已有 ' + count + ' 个账号' : '写下现在，寄给未来' })
      ),
      form,
      h('div', { class: 'auth-foot' },
        cloud.isConfigured()
          ? h('span', null, '云端账号 · 可跨设备加好友聊天')
          : h('span', null, '账号和胶囊都只存在这台电脑上'),
        h('br'),
        h('button', {
          class: 'auth-link',
          onclick: () => cloud.openCloudConfig(() => render())
        }, cloud.isConfigured() ? '云服务设置' : '想联网聊天？设置云服务')
      )
    );
  }

  render();
  return root;
}

/* ==================== src\screens\chat.js ==================== */
/* 聊天：会话列表 + 对话（本机模式 / 云端模式） */






function onlineMe() {
  if (!cloud.isConfigured()) return null;
  return cloud.getSession();
}

function avatarEl(hasDot) {
  return h('span', {
    class: 'chat-avatar',
    html: svg('cartoon') + (hasDot ? '<span class="chat-dot"></span>' : '')
  });
}

/* ---------------- 会话列表 ---------------- */
function renderChat(ctx) {
  const me = ctx.state.user;
  const online = onlineMe();
  const back = () => ctx.navigate('me');

  const right = h('span', { class: 'placeholder' });

  const appbar = h('header', { class: 'appbar' },
    h('button', { onclick: back }, '‹ 返回'),
    h('div', { class: 'mid', text: '消息' }),
    right
  );

  const rows = h('div', { class: 'chat-list' });
  const scroll = h('div', { class: 'scroll chat-scroll' }, rows);

  rows.append(h('button', {
    class: 'chat-row',
    onclick: () => ctx.navigate('thread', { threadId: BOT_ID })
  },
    avatarEl(),
    h('div', { class: 'chat-row-body' },
      h('div', { class: 'chat-row-top' }, h('span', { class: 'chat-row-name', text: '时光助手' })),
      h('div', { class: 'chat-row-sub', text: '有问题可以问我' })
    )
  ));

  if (!online) {
    const others = listUsers().filter((u) => u.id !== me.id);
    for (const u of others) {
      const last = lastThread(me.id, u.id);
      rows.append(h('button', {
        class: 'chat-row',
        onclick: () => ctx.navigate('thread', { threadId: u.id })
      },
        avatarEl(),
        h('div', { class: 'chat-row-body' },
          h('div', { class: 'chat-row-top' },
            h('span', { class: 'chat-row-name', text: u.nick }),
            last ? h('span', { class: 'chat-row-time', text: fmtTime(last.ts) }) : null
          ),
          h('div', { class: 'chat-row-sub', text: last ? last.text : '编号 ' + u.id })
        )
      ));
    }
    rows.append(h('div', { class: 'chat-hint' },
      '当前是本机模式，只能和这台电脑上的账号聊天。',
      h('br'),
      '想让朋友远程和你聊，请到「我的 → 云服务」填好 Supabase 地址和密钥。'
    ));
    return h('section', { class: 'screen' }, appbar, scroll);
  }

  /* 云端模式 */
  rows.append(h('div', { class: 'chat-hint', text: '正在加载好友…' }));
  (async () => {
    try {
      const list = await cloud.listFriends(me.id);
      const unread = await cloud.unreadBySender(me.id);
      rows.textContent = '';
      rows.append(h('button', {
        class: 'chat-row',
        onclick: () => ctx.navigate('thread', { threadId: BOT_ID })
      },
        avatarEl(),
        h('div', { class: 'chat-row-body' },
          h('div', { class: 'chat-row-top' }, h('span', { class: 'chat-row-name', text: '时光助手' })),
          h('div', { class: 'chat-row-sub', text: '有问题可以问我' })
        )
      ));

      const pending = list.filter((r) => r.status !== 'accepted' && String(r.requester) !== String(me.id));
      for (const req of pending) {
        const otherId = String(req.a) === String(me.id) ? req.b : req.a;
        let nick = otherId;
        try { const u = await cloud.getUserById(otherId); if (u) nick = u.nick + '（编号 ' + u.id + '）'; } catch (err) { /* ignore */ }
        rows.append(h('div', { class: 'chat-row friend-req' },
          avatarEl(),
          h('div', { class: 'chat-row-body' },
            h('div', { class: 'chat-row-name', text: nick }),
            h('div', { class: 'chat-row-sub', text: '申请加你为好友' })
          ),
          h('button', {
            class: 'btn btn-primary btn-sm',
            onclick: async () => {
              const r = await cloud.acceptFriend(req.id);
              if (r.ok) { toast('已添加好友'); ctx.render(); } else { toast(r.error); }
            }
          }, '接受')
        ));
      }

      const accepted = list.filter((r) => r.status === 'accepted');
      for (const fr of accepted) {
        const otherId = String(fr.a) === String(me.id) ? fr.b : fr.a;
        let u = null;
        try { u = await cloud.getUserById(otherId); } catch (err) { /* ignore */ }
        let last = null;
        try { const msgs = await cloud.listMessages(me.id, otherId); last = msgs.length ? msgs[msgs.length - 1] : null; } catch (err) { /* ignore */ }
        rows.append(h('button', {
          class: 'chat-row',
          onclick: () => ctx.navigate('thread', { threadId: otherId })
        },
          avatarEl((unread[otherId] || 0) > 0),
          h('div', { class: 'chat-row-body' },
            h('div', { class: 'chat-row-top' },
              h('span', { class: 'chat-row-name', text: u ? u.nick : otherId }),
              last ? h('span', { class: 'chat-row-time', text: fmtClock(last.created_at) }) : null
            ),
            h('div', { class: 'chat-row-sub', text: last ? last.text : '编号 ' + otherId })
          )
        ));
      }

      if (!pending.length && !accepted.length) {
        rows.append(h('div', { class: 'chat-hint' },
          '还没有好友。点右上角「＋ 好友」，输入对方的编号或昵称发送申请。'
        ));
      }
    } catch (err) {
      rows.textContent = '';
      rows.append(h('div', { class: 'chat-hint', text: '云端加载失败：' + String(err.message || err).slice(0, 80) }));
    }
  })();

  return h('section', { class: 'screen' }, appbar, scroll);
}

function fmtClock(iso) {
  try {
    const d = new Date(iso);
    const p = (n) => (n < 10 ? '0' + n : '' + n);
    return p(d.getHours()) + ':' + p(d.getMinutes());
  } catch (err) {
    return '';
  }
}

/* ---------------- 对话 ---------------- */
function renderThread(ctx) {
  const me = ctx.state.user;
  const id = ctx.state.threadId || BOT_ID;
  const back = () => ctx.navigate('chat');
  const isBot = id === BOT_ID;
  const online = onlineMe();
  const cloudThread = !!online && !isBot;

  let name = '时光助手';
  if (!isBot) {
    if (cloudThread) name = '好友 ' + id;
    else {
      const u = listUsers().find((x) => x.id === id);
      name = u ? u.nick : id;
    }
  }

  const appbar = h('header', { class: 'appbar' },
    h('button', { onclick: back }, '‹ 返回'),
    h('div', { class: 'mid', text: name }),
    h('span', { class: 'placeholder' })
  );

  const list = h('div', { class: 'msg-list' });
  const scroll = h('div', { class: 'scroll msg-scroll' }, list);

  function scrollBottom() {
    requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
  }

  function addBubble(msg) {
    const mine = String(msg.from) === String(me.id) || String(msg.from_id) === String(me.id);
    const text = msg.text;
    const ts = msg.ts || (msg.created_at ? new Date(msg.created_at).getTime() : Date.now());
    list.append(h('div', { class: 'msg' + (mine ? ' me' : '') },
      h('div', { class: 'bubble', text: text }),
      h('div', { class: 'msg-time', text: fmtClock(new Date(ts).toISOString()) })
    ));
    scrollBottom();
  }

  const input = h('input', { class: 'chat-input', type: 'text', maxlength: '200', placeholder: '说点什么…' });
  const sendBtn = h('button', { class: 'btn btn-primary chat-send' }, '发送');

  if (cloudThread) {
    let lastId = '';
    const known = new Set();
    function markLatest(msgs) {
      let maxTs = 0;
      for (const m of msgs) {
        const t = new Date(m.created_at || Date.now()).getTime();
        if (t > maxTs) maxTs = t;
      }
      if (maxTs) cloud.markRead(me.id, id, maxTs);
    }
    function appendNew(msgs) {
      for (const m of msgs) {
        if (!m || !m.id || known.has(m.id)) continue;
        if (known.size === 0 && list.querySelector('.msg')) list.textContent = '';
        const empty = list.querySelector('.msg-empty');
        if (empty) empty.remove();
        addBubble(m);
        known.add(m.id);
        lastId = m.id;
      }
    }
    async function load() {
      try {
        const msgs = await cloud.listMessages(me.id, id);
        if (!list.querySelector('.msg') && !msgs.length) {
          list.append(h('div', { class: 'msg-empty', text: '还没有聊过，发第一条消息吧。' }));
        }
        appendNew(msgs);
        markLatest(msgs);
      } catch (err) { /* 网络抖动时静默 */ }
    }
    (async () => {
      try {
        const msgs = await cloud.listMessages(me.id, id);
        if (!msgs.length) list.append(h('div', { class: 'msg-empty', text: '还没有聊过，发第一条消息吧。' }));
        else appendNew(msgs);
        markLatest(msgs);
      } catch (err) {
        list.append(h('div', { class: 'msg-empty', text: '云端加载失败：' + String(err.message || err).slice(0, 70) }));
      }
      const timer = setInterval(load, 2500);
      ctx.registerCleanup(() => clearInterval(timer));
    })();

    sendBtn.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      try {
        const res = await cloud.cloudSendMessage(me.id, id, text);
        if (!res.ok) { toast(res.error); return; }
        const empty = list.querySelector('.msg-empty');
        if (empty) empty.remove();
        addBubble(res.message);
        known.add(res.message.id);
        lastId = res.message.id;
      } catch (err) {
        toast('发送失败：' + String(err.message || err).slice(0, 60));
      }
    };
  } else {
    const msgs = listThread(me.id, id);
    for (const m of msgs) addBubble(m);
    if (!msgs.length) list.append(h('div', { class: 'msg-empty', text: isBot ? '问一句试试，比如「今天适合写什么？」' : '还没有聊过，发第一条消息吧。' }));

    sendBtn.onclick = () => {
      const text = input.value.trim();
      if (!text) return;
      const msg = sendMessage(me.id, id, text);
      if (!msg) return;
      const empty = list.querySelector('.msg-empty');
      if (empty) empty.remove();
      addBubble(msg);
      input.value = '';
      input.focus();
      if (isBot) {
        setTimeout(() => {
          const reply = sendMessage(BOT_ID, me.id, botReply());
          if (reply && ctx.state.view === 'thread' && ctx.state.threadId === BOT_ID) addBubble(reply);
        }, 900);
      }
    };
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
  });

  const bar = h('div', { class: 'chat-bar' }, input, sendBtn);
  scrollBottom();
  setTimeout(() => { try { input.focus(); } catch (e) { /* ignore */ } }, 120);

  return h('section', { class: 'screen' }, appbar, scroll, bar);
}

/* ==================== src\main.js ==================== */
/* 应用入口：状态、路由、每秒 tick、封存/删除等全局动作 */


















const state = {
  capsules: [],
  user: null,
  view: 'home',
  timeMode: 'now',
  editorId: null,
  previewId: null,
  detailId: null,
  threadId: null,
  justOpened: null,
  flush: null,
  cleanup: null
};

const notified = new Set();
let lastDayKey = '';
const APP_VERSION = 'v1.49';

function dateKeyOf(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

const ctx = {
  state,
  get capsules() { return state.capsules; },
  navigate,
  render,
  refresh,
  actions: {},
  version: APP_VERSION,
  registerFlush(fn) { state.flush = fn || null; },
  registerCleanup(fn) { state.cleanup = fn || null; }
};

function now() { return Date.now(); }

function uid(prefix) {
  return (prefix || 'cap') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

function findCapsule(id) {
  return state.capsules.find((c) => c.id === id) || null;
}

async function refresh() {
  const all = await store.listCapsules();
  const uid = state.user ? state.user.id : null;
  state.capsules = uid ? all.filter((c) => c.ownerId === uid) : [];
  return state.capsules;
}

function clearView() {
  const viewEl = document.getElementById('view');
  if (viewEl) viewEl.textContent = '';
  closeLayer();
  releaseAll();
  if (typeof state.cleanup === 'function') {
    try { state.cleanup(); } catch (err) { /* ignore */ }
  }
  state.cleanup = null;
  state.flush = null;
}

function updateHash(view) {
  let h = '';
  if (view === 'time') h = '#time';
  else if (view === 'me') h = '#me';
  else if (view === 'chat') h = '#chat';
  else if (view === 'thread' && state.threadId) h = '#thread=' + state.threadId;
  else if (view === 'detail' && state.detailId) h = '#detail=' + state.detailId;
  else if (view === 'editor' && state.editorId) h = '#editor=' + state.editorId;
  else if (view === 'preview' && state.previewId) h = '#preview=' + state.previewId;
  try {
    history.replaceState(null, '', location.pathname + location.search + h);
  } catch (err) { /* 本地页面一般不会失败 */ }
}

function navigate(view, params) {
  const p = params || {};
  state.view = view;
  if (view === 'editor') state.editorId = p.editorId || null;
  if (view === 'preview') state.previewId = p.previewId || null;
  if (view === 'detail') state.detailId = p.detailId || null;
  if (view === 'time' && p.timeMode) state.timeMode = p.timeMode;
  if (view === 'thread') state.threadId = p.threadId || null;
  updateHash(view);
  render();
  if (view === 'home' || view === 'me' || view === 'chat' || view === 'thread') {
    setTimeout(refreshUnread, 150);
  }
  // 打开「消息」列表就算看过消息：清掉红点（云端记录，换设备同步）
  if (view === 'chat' && state.user && cloud.isConfigured() && cloud.getSession()) {
    setTimeout(function () {
      cloud.markAllRead(state.user.id).then(function () { refreshUnread(); }).catch(function () { /* ignore */ });
    }, 500);
  }
}

/* ---------------- 未读消息红点 ---------------- */
let unreadCount = 0;
let unreadTimer = null;
let weatherTimer = null;
let syncTimer = null;
let lastCheckAt = 0;
const nickCache = new Map();

function paintUnread() {
  const dot = document.getElementById('meUnreadDot');
  if (dot) dot.classList.toggle('on', unreadCount > 0);
}

/* 首页「我的」上方的小气泡：有新消息时告诉用户是谁发的 */
async function updateHomeTip() {
  const tip = document.getElementById('meTip');
  if (!tip) return;
  if (unreadCount <= 0 || !state.user) {
    tip.hidden = true;
    tip.textContent = '';
    return;
  }
  try {
    const last = await cloud.lastIncoming(state.user.id);
    if (!last) { tip.hidden = true; return; }
    let nick = nickCache.get(last.from_id);
    if (!nick) {
      const u = await cloud.getUserById(last.from_id);
      nick = u ? u.nick : last.from_id;
      nickCache.set(last.from_id, nick);
    }
    const full = String(last.text || '');
    const preview = full.length > 14 ? full.slice(0, 14) + '…' : full;
    tip.textContent = nick + '：' + preview;
    tip.hidden = false;
  } catch (err) {
    tip.hidden = true;
  }
}

async function refreshUnread() {
  if (!state.user || !cloud.isConfigured() || !cloud.getSession()) {
    unreadCount = 0;
    paintUnread();
    updateHomeTip();
    return;
  }
  try {
    unreadCount = await cloud.countUnread(state.user.id);
  } catch (err) { /* 保持旧值 */ }
  lastCheckAt = Date.now();
  paintUnread();
  updateHomeTip();
}

ctx.diag = function () {
  return { lastCheckAt: lastCheckAt, unreadCount: unreadCount };
};

ctx.actions.forceCheckUnread = async function () {
  await refreshUnread();
  const last = state.user ? await cloud.lastIncoming(state.user.id) : null;
  if (last) {
    const when = new Date(last.created_at).toLocaleTimeString();
    toast('未读 ' + unreadCount + ' 条 · 最新一条 ' + when);
  } else {
    toast('暂时没有收到新消息');
  }
  return unreadCount;
};

/** 刷新后停在原来的页面（可选能力） */
function applyHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return false;
  const parts = raw.split('=');
  const view = parts[0];
  const id = parts[1] || '';
  if (view === 'time') { navigate('time'); return true; }
  if (view === 'me') { navigate('me'); return true; }
  if (view === 'chat') { navigate('chat'); return true; }
  if (view === 'thread' && id) { navigate('thread', { threadId: id }); return true; }
  if (view === 'detail' && id) { ctx.actions.openCapsule(id); return true; }
  if (view === 'editor' && id) { navigate('editor', { editorId: id }); return true; }
  if (view === 'preview' && id) { navigate('preview', { previewId: id }); return true; }
  return false;
}

function render() {
  const viewEl = document.getElementById('view');
  clearView();
  let node = null;
  try {
    switch (state.view) {
      case 'home': node = renderHome(ctx); break;
      case 'time': node = renderTime(ctx); break;
      case 'editor': node = renderEditor(ctx); break;
      case 'preview': node = renderPreview(ctx); break;
      case 'detail': node = renderDetail(ctx); break;
      case 'me': node = renderMe(ctx); break;
      case 'chat': node = renderChat(ctx); break;
      case 'thread': node = renderThread(ctx); break;
      default: node = renderHome(ctx);
    }
  } catch (err) {
    console.error(err);
    node = null;
  }
  if (node) viewEl.appendChild(node);
}

/* ---------------- 全局动作 ---------------- */
ctx.actions.startDraft = async function () {
  if (!state.user) { showAuth(); return; }
  const cap = {
    id: uid('cap'),
    ownerId: state.user.id,
    title: '',
    body: '',
    media: [],
    unlockAt: null,
    createdAt: now(),
    updatedAt: now(),
    sealedAt: null,
    openedAt: null,
    status: 'draft'
  };
  state.capsules.push(cap);
  try { await store.saveCapsule(cap); } catch (err) { toast('保存失败：' + err.message); }
  navigate('editor', { editorId: cap.id });
};

ctx.actions.openDraft = function (id) {
  navigate('editor', { editorId: id });
};

ctx.actions.openCapsule = async function (id) {
  const cap = findCapsule(id);
  if (!cap) return;
  if (cap.status === 'sealed' && cap.unlockAt <= now()) {
    cap.status = 'opened';
    cap.openedAt = now();
    cap.updatedAt = now();
    state.justOpened = cap.id;
    try { await store.saveCapsule(cap); } catch (err) { toast('记录开启时间失败'); }
  }
  navigate('detail', { detailId: cap.id });
};

ctx.actions.seal = async function (cap) {
  if (!cap) return;
  const title = (cap.title || '').trim();
  const body = (cap.body || '').trim();
  if (!title && !body) { toast('先写点什么再封存'); return; }
  if (!isAllowedUnlock(cap.unlockAt)) { toast('先选一个未来的开启时间'); return; }

  const ok = await confirmDialog({
    title: '确定要封存吗？',
    message: '封存后，在 <b>' + fmtDateTime(cap.unlockAt) + '</b> 之前，你无法再修改，也无法查看里面的文字、图片和视频。',
    okText: '确认封存',
    cancelText: '再改改'
  });
  if (!ok) return;

  cap.status = 'sealed';
  cap.sealedAt = now();
  cap.updatedAt = now();
  try {
    await store.saveCapsule(cap);
  } catch (err) {
    toast('保存失败：' + err.message);
    return;
  }
  notified.delete(cap.id);
  cloud.pushCapsuleSync(state.user.id, capsuleSyncPayload(cap)).catch(function () { /* ignore */ });
  toast('已封存 · ' + fmtDateTime(cap.unlockAt) + ' 开启');
  await refresh();
  navigate('home');
};

ctx.actions.deleteCapsule = async function (cap) {
  if (!cap) return;

  // 删除必须过 4 位密码：第一次先设置，之后就都要输入
  let justSet = false;
  if (!hasPin()) {
    const set = await requestNewPin({
      title: '先设一个删除密码',
      message: '以后每次删除胶囊都要输入这 4 位数字，防止手滑把信删掉。<br>密码只存在这台电脑上，忘了只能清空浏览器数据。',
      okText: '保存密码并删除'
    });
    if (!set) return;
    justSet = true;
  }

  if (!justSet) {
    const ok = await requestPin({
      title: '删除这封胶囊？',
      message: '删除后无法恢复，文字、图片和视频都会从本机移除。',
      okText: '删除',
      danger: true
    });
    if (!ok) return;
  }

  try {
    await store.deleteCapsule(cap.id);
  } catch (err) {
    toast('删除失败：' + err.message);
    return;
  }
  state.capsules = state.capsules.filter((c) => c.id !== cap.id);
  cloud.pushCapsuleSync(state.user.id, { id: cap.id, deleted: true, updatedAt: now() }).catch(function () { /* ignore */ });
  toast('已删除');
  navigate('home');
  refresh();
};

ctx.actions.discardDraft = async function (cap) {
  try { await store.deleteCapsule(cap.id); } catch (err) { /* 忽略 */ }
  state.capsules = state.capsules.filter((c) => c.id !== cap.id);
  if (state.user) cloud.pushCapsuleSync(state.user.id, { id: cap.id, deleted: true, updatedAt: now() }).catch(function () { /* ignore */ });
};

/* ---------------- 每秒 tick ---------------- */
function tick() {
  const d = new Date();

  const dayKey = dateKeyOf(d);
  if (lastDayKey && dayKey !== lastDayKey) {
    lastDayKey = dayKey;
    if (state.user) {
      if (state.view === 'home') render();
      maybeShowBirthday(ctx);
    }
  }

  const hm = fmtHM(d);
  const sec = pad2(d.getSeconds());
  const dateText = fmtDateCN(d);

  const status = document.getElementById('statusClock');
  if (status) status.textContent = hm;

  document.querySelectorAll('[data-clock-hm]').forEach((el) => { el.textContent = hm; });
  document.querySelectorAll('[data-clock-sec]').forEach((el) => { el.textContent = sec; });
  document.querySelectorAll('[data-clock-date]').forEach((el) => { el.textContent = dateText; });
  document.querySelectorAll('[data-countdown]').forEach((el) => {
    el.textContent = countdownText(Number(el.getAttribute('data-countdown')) - d.getTime());
  });
  document.querySelectorAll('[data-countdown-long]').forEach((el) => {
    el.textContent = countdownLong(Number(el.getAttribute('data-countdown-long')) - d.getTime());
  });

  const t = d.getTime();
  const justDue = state.capsules.filter((c) => c.status === 'sealed' && c.unlockAt <= t && !notified.has(c.id));
  if (justDue.length) {
    justDue.forEach((c) => notified.add(c.id));
    toast(justDue.length === 1 ? '有 1 封胶囊到期了' : '有 ' + justDue.length + ' 封胶囊到期了', 2600);
    if (state.view === 'home') render();
  }

  if (state.view === 'detail') {
    const cap = findCapsule(state.detailId);
    if (cap && cap.status === 'sealed' && cap.unlockAt <= t) {
      ctx.actions.openCapsule(cap.id);
    }
  }
}

/* ---------------- 启动 ---------------- */
function showBootError(err) {
  const box = document.getElementById('bootError');
  const detail = document.getElementById('bootErrorDetail');
  if (detail) detail.textContent = err && err.message ? err.message : String(err || '');
  if (box) box.hidden = false;
}

async function checkStorage() {
  const info = await store.estimate();
  if (!info || !info.quota) return;
  const ratio = info.usage / info.quota;
  if (ratio > 0.85) {
    toast('本机存储快满了，建议删掉几封带视频的旧胶囊', 3600);
  }
}

let tickStarted = false;
let focusHooked = false;

function showAuth() {
  state.view = 'auth';
  state.user = null;
  state.capsules = [];
  const viewEl = document.getElementById('view');
  if (!viewEl) return;
  viewEl.textContent = '';
  closeLayer();
  releaseAll();
  viewEl.appendChild(renderAuth(ctx));
  try { history.replaceState(null, '', location.pathname + location.search); } catch (err) { /* ignore */ }
}

/* ---------------- 胶囊云同步（文本/状态跨设备；媒体留在原设备） ---------------- */
let lastSyncAt = 0;

function capsuleSyncPayload(c) {
  return {
    id: c.id,
    title: c.title || '',
    body: c.body || '',
    unlockAt: c.unlockAt || 0,
    status: c.status || 'sealed',
    createdAt: c.createdAt || 0,
    updatedAt: c.updatedAt || 0,
    sealedAt: c.sealedAt || 0,
    openedAt: c.openedAt || 0,
    mediaCount: (c.media || []).length,
    media: (c.media || []).map(function (m) {
      return { id: m.id, kind: m.kind, name: m.name || '', type: m.type || '', size: m.size || 0, duration: m.duration || null };
    })
  };
}

async function syncCapsules(force) {
  if (!cloud.isConfigured() || !cloud.getSession() || !state.user) return;
  if (!force && Date.now() - lastSyncAt < 30000) return;
  lastSyncAt = Date.now();
  try {
    const cloudList = await cloud.listCapsuleSync(state.user.id);
    const latest = new Map();
    for (const p of cloudList) latest.set(p.id, p);

    const localAll = await store.listCapsules();
    const mine = localAll.filter((c) => c.ownerId === state.user.id);
    let changed = false;

    for (const p of latest.values()) {
      const local = mine.find((c) => c.id === p.id);
      if (p.deleted) {
        if (local) { await store.deleteCapsule(p.id); changed = true; }
        continue;
      }
      const cloudUpdated = Number(p.updatedAt) || 0;
      const localUpdated = local ? (Number(local.updatedAt) || 0) : -1;
      if (!local || cloudUpdated > localUpdated) {
        const localMedia = local ? (local.media || []) : [];
        const capObj = {
          id: p.id,
          title: p.title || '',
          body: p.body || '',
          unlockAt: p.unlockAt || 0,
          status: p.status || 'sealed',
          createdAt: p.createdAt || Date.now(),
          updatedAt: p.updatedAt || Date.now(),
          sealedAt: p.sealedAt || 0,
          openedAt: p.openedAt || 0,
          ownerId: state.user.id,
          media: localMedia,
          mediaMissing: Math.max(0, (Number(p.mediaCount) || 0) - localMedia.length)
        };
        await store.saveCapsule(capObj);
        if (cloud.mediaSyncEnabled && cloud.mediaSyncEnabled() && Array.isArray(p.media) && p.media.length) {
          const got = localMedia.slice();
          for (const meta of p.media) {
            if (got.some(function (x) { return x.id === meta.id; })) continue;
            let blob = null;
            try { blob = await store.getBlob(meta.id); } catch (err) { blob = null; }
            if (!blob) { try { blob = await cloud.pullMedia(state.user.id, p.id, meta); } catch (err) { blob = null; } }
            if (blob) {
              try { await store.saveBlob({ id: meta.id, capsuleId: p.id, blob: blob }); } catch (err) { /* ignore */ }
              got.push({ id: meta.id, kind: meta.kind, name: meta.name || '', type: meta.type || '', size: meta.size || blob.size, duration: meta.duration || null });
            }
          }
          if (got.length) {
            capObj.media = got;
            capObj.mediaMissing = Math.max(0, p.media.length - got.length);
            await store.saveCapsule(capObj);
          }
        }
        changed = true;
      }
    }

    for (const c of mine) {
      const p = latest.get(c.id);
      if (!p || (Number(c.updatedAt) || 0) > (Number(p.updatedAt) || 0)) {
        await cloud.pushCapsuleSync(state.user.id, capsuleSyncPayload(c)).catch(function () { /* ignore */ });
      }
    }

    if (cloud.mediaSyncEnabled && cloud.mediaSyncEnabled()) {
      for (const c of mine) {
        const p = latest.get(c.id);
        if (p && p.deleted) continue;
        for (const m of (c.media || [])) {
          try {
            if (await cloud.hasMedia(state.user.id, c.id, m.id)) continue;
            const blob = await store.getBlob(m.id);
            if (blob) await cloud.pushMedia(state.user.id, c.id, m, blob);
          } catch (err) { /* ignore */ }
        }
      }
    }

    if (changed) {
      await refresh();
      if (state.view === 'home' || state.view === 'me') render();
    }
  } catch (err) { /* 忽略同步失败 */ }
}

ctx.actions.syncCapsules = function () { return syncCapsules(true); };

async function startApp(user) {
  state.user = user;
  try { await claimOrphans(store, user.id); } catch (err) { /* 忽略 */ }
  await refresh();

  // 胶囊归属迁移：本机旧账号 / 已改编号的旧账号，都归到当前云端账号名下
  if (cloud.isConfigured() && cloud.getSession() && !state.capsules.length) {
    try {
      const ids = new Set(await cloud.listUserIds());
      ids.add(user.id);
      const all = await store.listCapsules();
      const move = all.filter((c) => !c.ownerId || !ids.has(c.ownerId));
      if (move.length) {
        for (const c of move) { c.ownerId = user.id; await store.saveCapsule(c); }
        await refresh();
        toast('已把原有胶囊迁移到当前账号');
      }
    } catch (err) { /* 忽略 */ }
  }

  const t = now();
  ensureNotified(dueList(t));

  if (!applyHash()) navigate('home');
  lastDayKey = dateKeyOf(new Date());
  maybeShowBirthday(ctx);
  checkStorage();
  refreshUnread();
  if (!unreadTimer) unreadTimer = setInterval(refreshUnread, 8000);

  // 胶囊云同步：启动拉一次，之后每 2 分钟尝试一次
  syncCapsules(true).catch(function () { /* ignore */ });
  if (!syncTimer) syncTimer = setInterval(function () { syncCapsules(false).catch(function () { /* ignore */ }); }, 120 * 1000);

  // 天气：启动时拉一次，之后每 30 分钟刷新；拿到数据后重绘首页/我的
  weatherRefresh(false).then(function () {
    if (state.view === 'home' || state.view === 'me') render();
  }).catch(function () { /* 忽略 */ });
  if (!weatherTimer) {
    weatherTimer = setInterval(function () {
      weatherRefresh(false).then(function () {
        if (state.view === 'home' || state.view === 'me') render();
      }).catch(function () { /* ignore */ });
    }, 30 * 60 * 1000);
  }
}

function dueList(t) {
  return state.capsules.filter((c) => c.status === 'sealed' && c.unlockAt <= t);
}

ctx.actions.afterAuth = function (user) {
  startApp(user).catch((err) => showBootError(err));
};

ctx.actions.logout = function () {
  logout();
  cloud.clearSession();
  notified.clear();
  state.user = null;
  state.capsules = [];
  showAuth();
  toast('已退出登录');
};

async function boot() {
  if (!store.isAvailable()) {
    showBootError(new Error('这个浏览器不支持 IndexedDB'));
    return;
  }
  try {
    await store.init();
  } catch (err) {
    showBootError(err);
    return;
  }
  if (!tickStarted) {
    setInterval(tick, 1000);
    tickStarted = true;
  }
  if (!focusHooked) {
    focusHooked = true;
    window.addEventListener('focus', function () { refreshUnread(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') refreshUnread();
    });
  }

  let user = cloud.isConfigured() ? cloud.getSession() : getSessionUser();
  const wantSetup = new URLSearchParams(location.search).get('setup') === 'cloud';
  // 云端账号可能被改过编号/删除：登录态失效时要求重新登录
  if (cloud.isConfigured() && user) {
    try {
      const fresh = await cloud.getUserById(user.id);
      if (!fresh) {
        cloud.clearSession();
        user = null;
        toast('账号信息已更新，请用新的编号重新登录');
      } else {
        user = { id: fresh.id, nick: fresh.nick };
      }
    } catch (err) { /* 断网时保持现有登录态 */ }
  }
  if (!user) {
    showAuth();
    if (wantSetup) setTimeout(() => cloud.openCloudConfig(() => showAuth()), 350);
    tick();
    return;
  }
  try {
    await startApp(user);
  } catch (err) {
    showBootError(err);
    return;
  }
  if (wantSetup) setTimeout(() => cloud.openCloudConfig(() => render()), 400);
  tick();
}

function ensureNotified(list) {
  if (!list.length) return;
  list.forEach((c) => notified.add(c.id));
  setTimeout(() => toast(list.length === 1 ? '有 1 封胶囊到期了' : '有 ' + list.length + ' 封胶囊到期了', 2800), 500);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLayer();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tick();
});

window.addEventListener('pagehide', () => {
  if (typeof state.flush === 'function') {
    try { state.flush(); } catch (err) { /* 尽力而为 */ }
  }
});

window.addEventListener('error', (e) => {
  showBootError(e.error || new Error(e.message || '脚本出错了'));
});
window.addEventListener('unhandledrejection', (e) => {
  showBootError(e.reason || new Error('有一个操作失败了'));
});

boot();


})();
